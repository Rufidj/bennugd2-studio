":"","e":"","g":"","ov":[]},{"n":"g3d_sky_set_gradient","m":"3d","c":"sky","p":["float","float","float","float","float","float"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_sky_set_clouds","m":"3d","c":"sky","p":["float","float"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_sky_set_low_clouds","m":"3d","c":"sky","p":["float","float","float","float"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_char_create","m":"3d","c":"char","p":["float","float","float","float","float"],"pn":["x","y","z","radio","altura"],"r":"int","d":"Crea un controlador de personaje (capsula) que camina por el terreno y las cajas de colision, con gravedad.","rd":"id del personaje","e":"pj = g3d_char_create(0, 2, 0, 0.4, 1.8);\n// cada frame:\ng3d_char_move(pj, vel_x, vel_z);\ng3d_char_update(pj, dt);","g":"04-personaje","ov":[]},{"n":"g3d_char_destroy","m":"3d","c":"char","p":["int"],"pn":["personaje"],"r":"int","d":"Destruye un personaje.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_move","m":"3d","c":"char","p":["int","float","float"],"pn":["personaje","vx","vz"],"r":"int","d":"Velocidad horizontal deseada para el siguiente G3D_CHAR_UPDATE (en el plano X,Z).","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_jump","m":"3d","c":"char","p":["int","float"],"pn":["personaje","velocidad"],"r":"int","d":"Salta con la velocidad vertical indicada, solo si esta en el suelo. Dentro del agua da una brazada hacia arriba.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_set_water","m":"3d","c":"char","p":["int","int","float"],"pn":["personaje","en_agua","superficie_y"],"r":"int","d":"Marca al personaje dentro (1) o fuera (0) del agua y la altura Y de la superficie. Hay que llamarla cada frame: activa la flotacion y el nado libre.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_update","m":"3d","c":"char","p":["int","float"],"pn":["personaje","dt"],"r":"int","d":"Avanza la simulacion del personaje (movimiento, gravedad, colisiones). Llamar una vez por frame.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_set_position","m":"3d","c":"char","p":["int","float","float","float"],"pn":["personaje","x","y","z"],"r":"int","d":"Coloca al personaje y le anula la velocidad.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_set_push","m":"3d","c":"char","p":["int","float"],"pn":["personaje","fuerza"],"r":"int","d":"Fuerza maxima con la que empuja cuerpos rigidos. 0 = no mueve nada, pero sigue chocando.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_set_tuning","m":"3d","c":"char","p":["int","float","float"],"pn":["personaje","escalon","pendiente_grados"],"r":"int","d":"Ajusta la altura maxima de escalon y la pendiente maxima transitable en grados (se ignora fuera de 1..89). Un valor de escalon negativo no cambia el actual.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_x","m":"3d","c":"char","p":["int"],"pn":["personaje"],"r":"float","d":"Posicion X del personaje.","rd":"X","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_y","m":"3d","c":"char","p":["int"],"pn":["personaje"],"r":"float","d":"Posicion Y del personaje.","rd":"Y","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_z","m":"3d","c":"char","p":["int"],"pn":["personaje"],"r":"float","d":"Posicion Z del personaje.","rd":"Z","e":"","g":"04-personaje","ov":[]},{"n":"g3d_char_grounded","m":"3d","c":"char","p":["int"],"pn":["personaje"],"r":"int","d":"Indica si el personaje esta apoyado en el suelo.","rd":"1 si esta en el suelo","e":"","g":"04-personaje","ov":[]},{"n":"g3d_road_create","m":"3d","c":"road","p":["int"],"pn":["cerrada"],"r":"int","d":"Crea una carretera vacia. Una carretera es SOLO informacion de por donde se puede circular: una lista de nodos unidos por curvas suaves. NO se dibuja ni cambia el suelo: el aspecto es el de tu terreno pintado o tu modelo (.glb), y el suelo el de tu terreno o tu colision. Todo lo demas (salida, meta, vueltas, rivales) lo hace el juego. Maximo 8 carreteras. Las que dibujas en el editor con la herramienta Carretera ya vienen creadas (id 0, 1...) al empezar tu codigo.","rd":"id de la carretera, o -1 si no quedan huecos","e":"carretera = g3d_road_create(1);   // 1 = circuito cerrado, 0 = abierta\ng3d_road_add_node(carretera, 0, 0, 0, 12, 0, 0, 0, 0);\ng3d_road_add_node(carretera, 60, 0, 0, 12, 0, 0, 0, 0);\ng3d_road_add_node(carretera, 60, 60, 0, 12, 0, 0, 0, 0);\ng3d_road_build(carretera);","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_destroy","m":"3d","c":"road","p":["int"],"pn":["carretera"],"r":"int","d":"Destruye una carretera.","rd":"","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_clear","m":"3d","c":"road","p":[],"pn":[],"r":"int","d":"Destruye todas las carreteras. g3d_scene_load tambien las borra antes de cargar las de la escena.","rd":"","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_add_node","m":"3d","c":"road","p":["int","float","float","float","float","float","int","float","int"],"pn":["carretera","x","z","y","ancho","peralte_grados","sigue_terreno","dy","superficie"],"r":"int","d":"Anade un nodo a la carretera. Las curvas entre nodos son suaves (tangentes Catmull-Rom). Ancho, peralte, altura y dy se interpolan hasta el nodo siguiente. Con sigue=1 la carretera va pegada al terreno (altura = terreno + dy) y 'y' se ignora; con sigue=0 va a la altura fija 'y'. La superficie es una etiqueta del tramo que SALE de este nodo: 0 asfalto, 1 tierra, 2 hielo, 3 barro, o lo que decida tu juego. Un peralte positivo sube el borde derecho (curvas a la izquierda). Maximo 512 nodos por carretera.","rd":"indice del nodo, o -1","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_set_tangent","m":"3d","c":"road","p":["int","int","float","float"],"pn":["carretera","nodo","tx","tz"],"r":"int","d":"Tangente propia de un nodo: la direccion y la 'fuerza' con la que la curva pasa por el. (0, 0) = automatica (la normal: la curva sale de los nodos vecinos). Sirve para curvas muy cerradas, o para reproducir un trazado dibujado en el editor, que guarda la tangente de los nodos que el usuario ha arrastrado. Hay que llamarla antes de G3D_ROAD_BUILD.","rd":"","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_build","m":"3d","c":"road","p":["int"],"pn":["carretera"],"r":"int","d":"Calcula la linea central de la carretera. Hay que llamarla despues de anadir los nodos y, si algun nodo sigue el terreno, DESPUES de cargar el terreno. g3d_scene_load ya la llama por ti para las carreteras de la escena. Una carretera cerrada necesita al menos 3 nodos; una abierta, 2.","rd":"numero de muestras de la linea central (unas cada 2 m), 0 si no hay trazado valido","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_count","m":"3d","c":"road","p":[],"pn":[],"r":"int","d":"Numero de carreteras ya calculadas.","rd":"cantidad","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_nodes","m":"3d","c":"road","p":["int"],"pn":["carretera"],"r":"int","d":"Numero de nodos de una carretera.","rd":"cantidad","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_closed","m":"3d","c":"road","p":["int"],"pn":["carretera"],"r":"int","d":"Indica si la carretera es un circuito cerrado.","rd":"1 si es cerrada","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_length","m":"3d","c":"road","p":["int"],"pn":["carretera"],"r":"float","d":"Longitud de la linea central de la carretera, en metros (unidades de mundo), contando la vuelta entera si es cerrada.","rd":"longitud","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_x","m":"3d","c":"road","p":["int","float"],"pn":["carretera","distancia"],"r":"float","d":"Posicion X del punto de la linea central situado a 'distancia' metros del principio. En una carretera cerrada la distancia da la vuelta (y admite negativos); en una abierta se recorta a los extremos.","rd":"X","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_y","m":"3d","c":"road","p":["int","float"],"pn":["carretera","distancia"],"r":"float","d":"Altura del punto de la carretera a 'distancia' metros del principio (ver G3D_ROAD_X).","rd":"Y","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_z","m":"3d","c":"road","p":["int","float"],"pn":["carretera","distancia"],"r":"float","d":"Posicion Z del punto de la carretera a 'distancia' metros del principio (ver G3D_ROAD_X).","rd":"Z","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_yaw","m":"3d","c":"road","p":["int","float"],"pn":["carretera","distancia"],"r":"float","d":"Hacia donde mira la carretera en ese punto, como rumbo en MILESIMAS DE GRADO: 0 mira hacia +Z y crece hacia +X (adelante = (sin rumbo, cos rumbo)), igual que el rumbo de un vehiculo. Vista desde una camara detras del coche (mirando a +Z), un rumbo creciente es un giro a la izquierda.","rd":"rumbo","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_width","m":"3d","c":"road","p":["int","float"],"pn":["carretera","distancia"],"r":"float","d":"Ancho de la carretera en ese punto, en metros.","rd":"ancho","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_surface","m":"3d","c":"road","p":["int","float"],"pn":["carretera","distancia"],"r":"int","d":"Etiqueta de superficie del tramo en ese punto (la que se puso en G3D_ROAD_ADD_NODE).","rd":"superficie","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_nearest","m":"3d","c":"road","p":["float","float"],"pn":["x","z"],"r":"int","d":"Busca el punto de carretera mas cercano a (x, z), de entre todas las carreteras, y guarda el resultado para las funciones G3D_ROAD_NEAR_*. Es la base de casi todo: en que vuelta va un coche, quien va primero, hacia donde apunta un rival o si se ha salido de la pista.","rd":"id de la carretera mas cercana, o -1 si no hay ninguna","e":"g3d_road_nearest(g3d_vehicle_x(v), g3d_vehicle_z(v));\nIF (NOT g3d_road_near_on())\n    say(\"Fuera de la pista\");\nEND","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_near_dist","m":"3d","c":"road","p":[],"pn":[],"r":"float","d":"De la ultima G3D_ROAD_NEAREST: distancia recorrida a lo largo de la carretera del punto mas cercano. Con ella se sabe en que vuelta va un coche (salta de casi 'largo' a casi 0 al cruzar la meta) o quien va por delante.","rd":"distancia en metros","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_near_offset","m":"3d","c":"road","p":[],"pn":[],"r":"float","d":"De la ultima G3D_ROAD_NEAREST: separacion lateral al centro de la carretera. Positiva hacia la izquierda de quien avanza por ella (hacia +X cuando el rumbo es 0), negativa hacia la derecha.","rd":"metros","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_near_y","m":"3d","c":"road","p":[],"pn":[],"r":"float","d":"De la ultima G3D_ROAD_NEAREST: altura de la carretera en ese punto.","rd":"altura","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_near_width","m":"3d","c":"road","p":[],"pn":[],"r":"float","d":"De la ultima G3D_ROAD_NEAREST: ancho de la carretera en ese punto.","rd":"ancho en metros","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_near_surface","m":"3d","c":"road","p":[],"pn":[],"r":"int","d":"De la ultima G3D_ROAD_NEAREST: etiqueta de superficie del tramo.","rd":"superficie","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_near_on","m":"3d","c":"road","p":[],"pn":[],"r":"int","d":"De la ultima G3D_ROAD_NEAREST: indica si el punto esta dentro del ancho de la carretera (separacion lateral menor o igual que la mitad del ancho).","rd":"1 si esta en la carretera","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_near_yaw","m":"3d","c":"road","p":[],"pn":[],"r":"float","d":"De la ultima G3D_ROAD_NEAREST: rumbo de la carretera en ese punto, en MILESIMAS DE GRADO (ver G3D_ROAD_YAW).","rd":"rumbo","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_show","m":"3d","c":"road","p":["int","int"],"pn":["carretera","escena"],"r":"int","d":"OPCIONAL: dibuja la carretera, creando su malla (una por superficie) como entidades de la escena. Normalmente NO se usa: tu carretera ya esta pintada en el terreno o es un modelo. Sirve para ver una carretera inventada por codigo (como en las guias) o para depurar. No la vuelve suelo: para eso G3D_ROAD_SET_GROUND. Hay que llamarla despues de G3D_ROAD_BUILD. Cada superficie tiene un color de serie (asfalto gris oscuro, tierra marron, hielo azul claro, barro marron oscuro).","rd":"numero de entidades creadas (una por superficie usada)","e":"g3d_road_build(carretera);\ng3d_road_show(carretera, escena);","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_set_ground","m":"3d","c":"road","p":["int","int"],"pn":["carretera","activar"],"r":"int","d":"Hace que la carretera cuente como SUELO (para el vehiculo, el personaje y las colisiones, via G3D_SCENE_TERRAIN_HEIGHT): dentro de su ancho, la altura es la de la carretera, con su peralte. Por defecto NO lo es (0): una carretera marcada en el editor solo dice por donde se puede circular y el suelo es el de tu terreno o tu modelo. Util para carreteras inventadas por codigo junto a G3D_ROAD_SHOW. Los cuerpos rigidos de Jolt no la notan.","rd":"","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_hide","m":"3d","c":"road","p":["int"],"pn":["carretera"],"r":"int","d":"Quita el dibujo de la carretera (sigue existiendo y siendo suelo).","rd":"","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_entity","m":"3d","c":"road","p":["int","int"],"pn":["carretera","superficie"],"r":"int","d":"Entidad con la que se dibuja una superficie de la carretera. Sirve para cambiar su aspecto con las funciones de siempre: g3d_entity_set_material, g3d_material_set_texture, g3d_entity_set_color... La textura se repite cada 8 m a lo largo de la carretera.","rd":"id de la entidad, o -1 si la carretera no tiene esa superficie","e":"// una textura de asfalto en la superficie 0\nm = g3d_material_create();\ng3d_material_set_texture(m, 0, g3d_load_texture(\"asfalto.png\"));\ng3d_entity_set_material(g3d_road_entity(carretera, 0), m);","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_road_set_color","m":"3d","c":"road","p":["int","float","float","float"],"pn":["superficie","r","g","b"],"r":"int","d":"Cambia el color de serie de una superficie (de 0 a 7), con componentes de 0.0 a 1.0. Afecta tambien a las carreteras ya dibujadas.","rd":"","e":"","g":"10-carreras-por-codigo","ov":[]},{"n":"g3d_physics_set_gravity","m":"3d","c":"physics","p":["float"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_collider_add_box","m":"3d","c":"collider","p":["float","float","float","float","float","float"],"pn":["min_x","min_y","min_z","max_x","max_y","max_z"],"r":"int","d":"Anade una caja de colision (AABB) en coordenadas del mundo. Los extremos se ordenan solos.","rd":"id de la caja","e":"","g":"04-personaje","ov":[]},{"n":"g3d_camera_safe_distance","m":"3d","c":"camera","p":["float","float","float","float","float","float","float","float"],"pn":["objetivo_x","objetivo_y","objetivo_z","dir_x","dir_y","dir_z","distancia","radio"],"r":"float","d":"Para camaras en tercera persona: dado el punto objetivo (t), la direccion hacia donde esta la camara (d), la distancia deseada y un radio, devuelve la distancia a la que se puede poner la camara sin atravesar cajas de colision ni terreno.","rd":"distancia segura (<= distancia)","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_collider_clear","m":"3d","c":"collider","p":[],"pn":[],"r":"int","d":"Elimina todas las cajas de colision.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_scatter_clear","m":"3d","c":"scatter","p":[],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_zone_clear","m":"3d","c":"zone","p":[],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_watersim_clear_sources","m":"3d","c":"watersim","p":[],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_char_clear_all","m":"3d","c":"char","p":[],"pn":[],"r":"int","d":"Destruye todos los personajes.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_collider_set_box","m":"3d","c":"collider","p":["int","float","float","float","float","float","float"],"pn":["caja","min_x","min_y","min_z","max_x","max_y","max_z"],"r":"int","d":"Cambia las dimensiones de una caja ya creada.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_collider_remove_box","m":"3d","c":"collider","p":["int"],"pn":["caja"],"r":"int","d":"Elimina una caja de colision.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_vehicle_create","m":"3d","c":"vehicle","p":["float","float","float","float"],"pn":["x","y","z","rumbo"],"r":"int","d":"Crea un vehiculo arcade (direccion tipo bicicleta y seguimiento del terreno con 4 ruedas). Valores por defecto: batalla 4.0, via 2.4, motor 26, velocidad maxima 55, giro maximo 32 grados, freno 40, resistencia 0.8. El rumbo va en MILESIMAS DE GRADO. Maximo 8 vehiculos.","rd":"id del vehiculo, o -1 si no quedan huecos","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_destroy","m":"3d","c":"vehicle","p":["int"],"pn":["vehiculo"],"r":"int","d":"Destruye un vehiculo.","rd":"","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_update","m":"3d","c":"vehicle","p":["int","float","float","float","float"],"pn":["vehiculo","dt","acelerador","direccion","freno"],"r":"int","d":"Avanza el vehiculo. acelerador de -1 a 1 (negativo = marcha atras), direccion de -1 a 1 y freno de 0 a 1 (los valores fuera de rango se recortan). Una direccion POSITIVA hace crecer el rumbo, es decir, gira hacia +X: a la izquierda de la pantalla si la camara va detras mirando a +Z. Con la velocidad la direccion pierde hasta un 40 % de autoridad. Solo acelera con las ruedas en el suelo. dt se limita a 0.1 s.","rd":"","e":"g3d_vehicle_update(coche, dt, acel, giro, freno);","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_set_geometry","m":"3d","c":"vehicle","p":["int","float","float","float"],"pn":["vehiculo","batalla","via","altura"],"r":"int","d":"Dimensiones: distancia entre ejes (batalla), distancia entre ruedas de un mismo eje (via) y altura de la suspension. Los valores demasiado pequenos se ignoran (batalla y via deben ser mayores que 0.1; la altura, 0 o mas).","rd":"","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_set_tuning","m":"3d","c":"vehicle","p":["int","float","float","float","float","float"],"pn":["vehiculo","motor","vel_maxima","giro_max_grados","freno","resistencia"],"r":"int","d":"Ajuste de conduccion: fuerza del motor, velocidad maxima, giro maximo en GRADOS, fuerza de frenado y resistencia. Un valor 0 o negativo deja el actual sin cambiar.","rd":"","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_x","m":"3d","c":"vehicle","p":["int"],"pn":["vehiculo"],"r":"float","d":"Posicion X del centro del chasis.","rd":"X","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_y","m":"3d","c":"vehicle","p":["int"],"pn":["vehiculo"],"r":"float","d":"Posicion Y del centro del chasis.","rd":"Y","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_z","m":"3d","c":"vehicle","p":["int"],"pn":["vehiculo"],"r":"float","d":"Posicion Z del centro del chasis.","rd":"Z","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_yaw","m":"3d","c":"vehicle","p":["int"],"pn":["vehiculo"],"r":"float","d":"Rumbo del vehiculo, en MILESIMAS DE GRADO.","rd":"angulo","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_pitch","m":"3d","c":"vehicle","p":["int"],"pn":["vehiculo"],"r":"float","d":"Inclinacion adelante/atras segun el terreno, en MILESIMAS DE GRADO.","rd":"angulo","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_roll","m":"3d","c":"vehicle","p":["int"],"pn":["vehiculo"],"r":"float","d":"Inclinacion lateral segun el terreno, en MILESIMAS DE GRADO.","rd":"angulo","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_vehicle_speed","m":"3d","c":"vehicle","p":["int"],"pn":["vehiculo"],"r":"float","d":"Velocidad hacia delante, con signo (negativa = marcha atras).","rd":"velocidad","e":"","g":"08-vehiculo","ov":[]},{"n":"g3d_rigidbody_create","m":"3d","c":"rigidbody","p":["float","float","float","float","float","float","float"],"pn":["x","y","z","hx","hy","hz","masa"],"r":"int","d":"Crea un cuerpo rigido en forma de caja. hx, hy, hz son las MEDIAS dimensiones (la mitad del ancho, alto y fondo); si valen menos de 0.01 se usa 0.5. Masa 0 o negativa = cuerpo FIJO: choca con todo pero no lo mueve nada (decorado solido). Rebote por defecto 0.12 y rozamiento 0.55. En PC la fisica de cuerpos rigidos la hace Jolt; en Vita y PS5 se usa un motor propio mas simple.","rd":"id del cuerpo, o -1 si no quedan huecos","e":"caja = g3d_rigidbody_create(0, 5, 0, 0.5, 0.5, 0.5, 10);\n// cada frame:\ng3d_rigidbody_step(dt);","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_create_sphere","m":"3d","c":"rigidbody","p":["float","float","float","float","float"],"pn":["x","y","z","radio","masa"],"r":"int","d":"Crea un cuerpo rigido esferico. Un radio menor de 0.01 se cambia por 0.5. Masa 0 = fijo.","rd":"id del cuerpo","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_create_capsule","m":"3d","c":"rigidbody","p":["float","float","float","float","float","float"],"pn":["x","y","z","radio","medio_alto","masa"],"r":"int","d":"Crea un cuerpo rigido en capsula. medio_alto es la mitad del alto de la parte CILINDRICA: la altura total de la capsula es 2 * (medio_alto + radio). Valores menores de 0.01 se cambian por 0.5. Masa 0 = fijo.","rd":"id del cuerpo","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_create_cylinder","m":"3d","c":"rigidbody","p":["float","float","float","float","float","float"],"pn":["x","y","z","radio","medio_alto","masa"],"r":"int","d":"Crea un cuerpo rigido cilindrico. medio_alto es la mitad del alto total. Valores menores de 0.01 se cambian por 0.5. Masa 0 = fijo.","rd":"id del cuerpo","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_create_convex","m":"3d","c":"rigidbody","p":["float","float","float","int","int","float","float"],"pn":["x","y","z","modelo","submalla","escala","masa"],"r":"int","d":"Crea un cuerpo rigido con la envolvente convexa de UNA submalla de un modelo (p. ej. un trozo de una fractura). El cuerpo se coloca en el centroide de la malla y gira sobre el. Falla (devuelve -1) si la submalla tiene menos de 4 vertices.","rd":"id del cuerpo, o -1 si falla","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_set_ccd","m":"3d","c":"rigidbody","p":["int","int"],"pn":["cuerpo","activar"],"r":"int","d":"Activa (1) la deteccion continua de colisiones del cuerpo, para que objetos pequenos y rapidos (una bala) no atraviesen paredes finas. Con 0 vuelve a la deteccion normal. Solo tiene efecto con Jolt.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_collider_add_mesh","m":"3d","c":"collider","p":["int","int","float","float","float","float"],"pn":["modelo","submalla","x","y","z","escala"],"r":"int","d":"Anade la malla EXACTA (triangulo a triangulo) de una submalla de un modelo como colision estatica: paredes, suelos, escaleras. No se mueve nunca (Jolt no admite malla movil). Para una malla de varias submallas usa G3D_COLLIDER_ADD_MODEL.","rd":"","e":"","g":"04-personaje","ov":[]},{"n":"g3d_collider_add_model","m":"3d","c":"collider","p":["int","float","float","float","float"],"pn":["modelo","x","y","z","escala"],"r":"int","d":"Anade el modelo ENTERO (todas sus submallas juntas) como una sola colision estatica exacta. Es la forma de dar colision a un nivel o un objeto completo con una sola llamada en vez de un bucle por submallas. Devuelve -1 si el modelo no tiene submallas.","rd":"-1 si falla","e":"g3d_collider_add_model(m_nivel, 0, 0, 0, 1.0);","g":"04-personaje","ov":[]},{"n":"g3d_collider_add_model_yaw","m":"3d","c":"collider","p":["int","float","float","float","float","float"],"pn":["modelo","x","y","z","escala","giro_grados"],"r":"int","d":"Igual que G3D_COLLIDER_ADD_MODEL pero con la malla girada alrededor de Y. OJO: el giro va en GRADOS normales (no en milesimas de grado). Util para una pista importada que hay que orientar. Solo existe con Jolt.","rd":"-1 si falla","e":"","g":"04-personaje","ov":[]},{"n":"g3d_wall_ray","m":"3d","c":"wall","p":["float","float","float","float","float","float","float"],"pn":[],"r":"float","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_rigidbody_create_convex_model","m":"3d","c":"rigidbody","p":["float","float","float","int","float","float"],"pn":["x","y","z","modelo","escala","masa"],"r":"int","d":"Crea un cuerpo rigido con la envolvente convexa de TODAS las submallas del modelo: se ajusta a su forma sin tener que dar tamanos. Es lo que hay que usar para lo que se mueve (un barril, una caja, una roca que rueda). Solo existe con Jolt: sin el, devuelve -1.","rd":"id del cuerpo, o -1 si falla","e":"barril = g3d_rigidbody_create_convex_model(0, 5, 0, m_barril, 1.0, 20);","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_destroy","m":"3d","c":"rigidbody","p":["int"],"pn":["cuerpo"],"r":"int","d":"Destruye un cuerpo rigido.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_clear","m":"3d","c":"rigidbody","p":[],"pn":[],"r":"int","d":"Destruye todos los cuerpos rigidos.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_step","m":"3d","c":"rigidbody","p":["float"],"pn":["dt"],"r":"int","d":"Avanza la simulacion de fisica. Llamala una vez por frame. dt se limita a 0.05 s. Antes de simular se incorpora el terreno de la escena como colision, asi que los cuerpos chocan con el suelo sin hacer nada mas.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_apply_impulse","m":"3d","c":"rigidbody","p":["int","float","float","float"],"pn":["cuerpo","ix","iy","iz"],"r":"int","d":"Aplica un impulso lineal: cambia la velocidad en impulso / masa. Despierta al cuerpo si estaba dormido (un cuerpo quieto durante un rato se duerme y, sin despertarlo, ignoraria el impulso).","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_set_velocity","m":"3d","c":"rigidbody","p":["int","float","float","float"],"pn":["cuerpo","vx","vy","vz"],"r":"int","d":"Fija la velocidad lineal del cuerpo. Despierta al cuerpo si dormia.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_set_damping","m":"3d","c":"rigidbody","p":["int","float","float"],"pn":["cuerpo","lineal","angular"],"r":"int","d":"Amortiguacion lineal y angular. Un valor negativo deja el actual sin cambiar.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_apply_angular_impulse","m":"3d","c":"rigidbody","p":["int","float","float","float"],"pn":["cuerpo","ax","ay","az"],"r":"int","d":"Aplica un impulso de giro: hace girar al cuerpo sin moverlo de sitio. Despierta al cuerpo si dormia.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_set_upright","m":"3d","c":"rigidbody","p":["int","float"],"pn":["cuerpo","fuerza"],"r":"int","d":"Fuerza con la que el cuerpo se endereza solo, llevando su 'arriba' hacia el 'arriba' del mundo (0 = no se endereza; los negativos cuentan como 0). Funciona con cualquier orientacion.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_set_buoyancy","m":"3d","c":"rigidbody","p":["int","float","float"],"pn":["cuerpo","agua_y","densidad_relativa"],"r":"int","d":"Flotacion. Indica el nivel Y del agua y la densidad del cuerpo RELATIVA al agua: menor que 1 flota (0.5 = flota a media agua), 1 queda a flor y mayor que 1 se hunde. 0 o menos desactiva la flotacion. El empuje se reparte por el volumen sumergido, no en el centro, asi que un cuerpo ancho y bajo aguanta, uno alto y estrecho vuelca, y un golpe fuerte tumba a cualquiera. Hay que repetir la llamada si el nivel del agua cambia.","rd":"","e":"g3d_rigidbody_set_buoyancy(barril, g3d_scene_water_level(), 0.6);   // flota","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_set_bounce","m":"3d","c":"rigidbody","p":["int","float","float"],"pn":["cuerpo","rebote","rozamiento"],"r":"int","d":"Rebote (restitucion) y rozamiento, ambos de 0 a 1. Un valor negativo deja el actual sin cambiar.","rd":"","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_x","m":"3d","c":"rigidbody","p":["int"],"pn":["cuerpo"],"r":"float","d":"Posicion X del centro del cuerpo.","r idbody_render_y","m":"3d","c":"rigidbody","p":["int"],"pn":["cuerpo"],"r":"float","d":"Y donde dibujar el modelo (ver G3D_RIGIDBODY_RENDER_X).","rd":"Y","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_render_z","m":"3d","c":"rigidbody","p":["int"],"pn":["cuerpo"],"r":"float","d":"Z donde dibujar el modelo (ver G3D_RIGIDBODY_RENDER_X).","rd":"Z","e":"","g":"05-fisica","ov":[]},{"n":"g3d_rigidbody_set_model_offset","m":"3d","c":"rigidbody","p":["int","float","float","float"],"pn":["cuerpo","ox","oy","oz"],"r":"int","d":"Desplazamiento entre el centro del cuerpo y el origen del modelo, que usan G3D_RIGIDBODY_RENDER_X/Y/Z. Por defecto es (0, medio_alto, 0), pensado para modelos con el origen en los pies.","rd":"","e":"g3d_entity_set_position(raiz, g3d_rigidbody_render_x(c), g3d_rigidbody_render_y(c), g3d_rigidbody_render_z(c));\ng3d_entity_set_rotation(raiz, g3d_rigidbody_angle_x(c), g3d_rigidbody_angle_y(c), g3d_rigidbody_angle_z(c));","g":"05-fisica","ov":[]},{"n":"g3d_sky_set_texture","m":"3d","c":"sky","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_sky_enable","m":"3d","c":"sky","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_mouse_capture","m":"3d","c":"mouse","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_mouse_update","m":"3d","c":"mouse","p":[],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_mouse_dx","m":"3d","c":"mouse","p":[],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_mouse_dy","m":"3d","c":"mouse","p":[],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_set_wireframe_mode","m":"3d","c":"set","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_set_shadows","m":"3d","c":"set","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_set_shadow_resolution","m":"3d","c":"set","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_set_hdr","m":" $("#tema").onclick=()=>{const r=document.documentElement;const osOscuro=matchMedia("(prefers-color-scheme: dark)").matches;const actual=r.dataset.theme||(osOscuro?"dark":"light");const n=actual=="dark"?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("tema",n)}catch(e){}};
try{const t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}
