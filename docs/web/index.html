<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1b1e23;--tx:#e6e7ea;--mut:#9aa0ab;--bd:#2c3038;--ac:#7db0ff;--acbg:#1f2c44;--cod:#1f2227;--ok:#5cd08a;--kw:#d78be0;--st:#e3b062;--cm:#7c8594;--fn:#7db0ff;--nu:#6fd3cc}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1b1e23;--tx:#e6e7ea;--mut:#9aa0ab;--bd:#2c3038;--ac:#7db0ff;--acbg:#1f2c44;--cod:#1f2227;--ok:#5cd08a;--kw:#d78be0;--st:#e3b062;--cm:#7c8594;--fn:#7db0ff;--nu:#6fd3cc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac)}code,pre{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--bd)}
header h1{font-size:16px;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--panel);color:var(--tx);font:inherit}

nav{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto;padding:14px 12px 40px 16px;border-right:1px solid var(--bd);background:var(--panel);font-size:14px}

nav details{margin:2px 0}nav summary{cursor:pointer;padding:3px 8px;border-radius:6px}nav summary:hover{background:var(--acbg)}

main{padding:28px clamp(16px,4vw,56px) 80px;max-width:960px;min-width:0}
main h1{font-size:30px;line-height:1.2;margin:0 0 16px}main h2{font-size:22px;margin:34px 0 10px;padding-top:6px;border-top:1px solid var(--bd)}main h3{font-size:17px;margin:24px 0 6px}
.bloque{position:relative;margin:14px 0}
.bloque pre{margin:0;padding:14px 16px;background:var(--cod);border:1px solid var(--bd);border-radius:10px;overflow:auto;font-size:13.5px;line-height:1.5}
.copiar{position:absolute;top:8px;right:8px;font-size:12px;padding:3px 8px;opacity:.0;transition:opacity .15s}.bloque:hover .copiar,.copiar:focus{opacity:1}

.verif:before{content:"\2713  "}
p code,li code,td code,h2 code,h3 code{background:var(--cod);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.9em}
.tabla{overflow:auto;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{padding:7px 12px;border:1px solid var(--bd);text-align:left;vertical-align:top}th{background:var(--panel)}

.firma{font-size:18px;padding:12px 16px;background:var(--cod);border:1px solid var(--bd);border-radius:10px;overflow:auto;margin:8px 0 18px}
.etq{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--acbg);color:var(--ac);margin-right:6px}
.aviso{color:var(--mut);font-style:italic}
.lista a{display:block;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;text-decoration:none;color:var(--tx)}.lista a:hover{background:var(--acbg)}
.lista .d{color:var(--mut);font-size:14px}
.k{color:var(--kw)}.s{color:var(--st)}.c{color:var(--cm);font-style:italic}.f{color:var(--fn)}.u{color:var(--nu)}
#res{display:none;position:absolute;left:16px;right:16px;top:52px;max-height:70vh;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#res a{display:block;padding:8px 14px;text-decoration:none;color:var(--tx);border-bottom:1px solid var(--bd)}#res a:hover,#res a.sel{background:var(--acbg)}
#res .d{color:var(--mut);font-size:13px}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav{position:fixed;left:0;top:57px;width:290px;z-index:4;transform:translateX(-100%);transition:transform .2s}nav.abierto{transform:none}#menu{display:inline-block}}

<script>
const D={"guias":[{"id":"01-primeros-pasos","t":"Primeros pasos","h":"<h1 id=\"primeros-pasos\">Primeros pasos<\/h1>\n<p>Un programa 3D en BennuGD2 son <strong>procesos normales<\/strong> que el motor 3D reconoce. No hay un bucle de render que escribir: el motor dibuja la escena activa cada frame, igual que BennuGD2 dibuja los gráficos 2D.<\/p>\n<h2 id=\"lo-m-nimo-escena-c-mara-luz-y-un-objeto\">Lo mínimo: escena, cámara, luz y un objeto<\/h2>\n<p>Cada cosa de la escena es un <code>PROCESS<\/code> con <code>ctype = C_3D<\/code> y un <code>csubtype<\/code> que dice qué es (<code>C3D_CAMERA<\/code>, <code>C3D_LIGHT<\/code>, <code>C3D_ENTITY<\/code>...). El motor lee las variables del proceso (<code>x<\/code>, <code>y<\/code>, <code>z<\/code>, <code>angle_y<\/code>, <code>target_x<\/code>...) y las aplica a la escena en cada frame, así que moverlo es cambiar una variable.<\/p>\n<div class=\"bloque\"><span class=\"verif\" title=\"Este ejemplo se compila con bgdc al generar la documentacion\">compila<\/span><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">import &quot;libmod_gfx&quot;; import &quot;libmod_misc&quot;; import &quot;libmod_input&quot;; import &quot;libmod_3d&quot;;\n\nGLOBAL\n    int escena;\n    int camara;\n\n// Una luz de sol. En una luz, la dirección es (target - posición).\nPROCESS sol()\nBEGIN\n    ctype = C_3D; csubtype = C3D_LIGHT;\n    entity = g3d_light_create(G3D_LIGHT_DIRECTIONAL);\n    target_x = 0.4; target_y = -0.8; target_z = 0.3;\n    intensity = 0.6;\n    LOOP FRAME; END\nEND\n\n// La cámara: dónde está y a dónde mira.\nPROCESS camara_fija()\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    x = 0.0; y = 3.0; z = -8.0;\n    target_x = 0.0; target_y = 1.0; target_z = 0.0;\n    fov = 60.0;\n    LOOP FRAME; END\nEND\n\n// Un cubo que gira. angle_y va en MILÉSIMAS DE GRADO: 1000 = 1 grado por frame.\nPROCESS cubo()\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, 0.0, 1.0, 0.0);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n    x = 0.0; y = 1.0; z = 0.0;      // la posición la manda el PROCESO, no el spawn\n    LOOP\n        angle_y += 1000;\n        FRAME;\n    END\nEND\n\nPROCESS main()\nBEGIN\n    escena = g3d_scene_create(&quot;demo&quot;);\n    g3d_scene_set_active(escena);\n    camara = g3d_camera_create();\n    g3d_camera_set_active(camara);\n\n    g3d_sky_set_gradient(0.25, 0.45, 0.85, 0.75, 0.85, 0.95);   // sin cielo la pantalla sale NEGRA\n    g3d_sky_enable(1);\n\n    sol();\n    camara_fija();\n    cubo();\n\n    LOOP\n        IF (key(_ESC)) exit(); END\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<h2 id=\"qu-has-aprendido\">Qué has aprendido<\/h2>\n<ul><li>La <strong>escena<\/strong> es el contenedor; solo se dibuja la activa (<code>g3d_scene_set_active<\/code>).<\/li><li>La <strong>cámara<\/strong> y la <strong>luz<\/strong> se crean con <code>g3d_camera_create<\/code> / <code>g3d_light_create<\/code> y se atan al<\/li><\/ul>\n<p>  proceso con la variable <code>entity<\/code>.<\/p>\n<ul><li><strong>El cielo es obligatorio.<\/strong> Sin <code>g3d_sky_set_gradient<\/code> y <code>g3d_sky_enable(1)<\/code> la pantalla sale negra.<\/li><li><strong>La posición la manda el proceso.<\/strong> Cada frame el motor pone la entidad en las <code>x<\/code>, <code>y<\/code>, <code>z<\/code> del proceso<\/li><\/ul>\n<p>  (que valen 0 al empezar), así que la posición que pasas a <code>g3d_entity_spawn<\/code> solo sirve hasta el primer   frame: asigna también <code>x<\/code>, <code>y<\/code>, <code>z<\/code>.<\/p>\n<ul><li>Hasta que <code>entity<\/code> no vale algo distinto de <code>-1<\/code>, el motor ignora el proceso.<\/li><li>Si prefieres no usar procesos, todo lo anterior también se puede hacer llamando a las funciones<\/li><\/ul>\n<p>  (<code>g3d_camera_set_position<\/code>, <code>g3d_entity_set_position<\/code>...). <strong>Ojo:<\/strong> si hay un proceso atado a esa   cámara o entidad, el proceso pisa lo que hagas a mano en el siguiente frame.<\/p>\n<h2 id=\"siguiente-paso\">Siguiente paso<\/h2>\n<p><a href=\"#guia/02-procesos-3d\">Procesos 3D<\/a> explica todas las variables que el motor lee de un proceso.<\/p>"},{"id":"02-procesos-3d","t":"Procesos 3D (componentes)","h":"<h1 id=\"procesos-3d-componentes\">Procesos 3D (componentes)<\/h1>\n<p>Un proceso con <code>ctype = C_3D<\/code> es un <strong>componente<\/strong> de la escena. Su <code>csubtype<\/code> decide de qué tipo. Cada frame, antes de dibujar, el motor copia las variables del proceso a la escena. El proceso solo empieza a contar cuando <code>entity<\/code> deja de valer <code>-1<\/code>. <strong>Eso incluye la posición<\/strong>: la entidad se coloca en las <code>x<\/code>, <code>y<\/code>, <code>z<\/code> del proceso (0 por defecto), no donde la creaste con <code>g3d_entity_spawn<\/code>.<\/p>\n<blockquote><strong>Ojo con las funciones sueltas.<\/strong> Si una entidad pertenece a un proceso, el proceso <strong>pisa cada frame<\/strong> lo que hagas con <code>g3d_entity_set_position<\/code>, <code>set_rotation<\/code>, <code>set_scale<\/code>, <code>set_color<\/code>, <code>set_alpha<\/code> y <code>set_blend<\/code>. Dentro de un proceso usa sus variables (<code>x<\/code>, <code>angle_y<\/code>, <code>size_x<\/code>, <code>color_r<\/code>, <code>alpha<\/code>...). Las funciones sueltas son para entidades que <strong>no<\/strong> tienen proceso.<\/blockquote>\n<h2 id=\"subtipos\">Subtipos<\/h2>\n<div class=\"tabla\"><table><thead><tr><th><code>csubtype<\/code><\/th><th>Qué es<\/th><th><code>entity<\/code> se obtiene con<\/th><\/tr><\/thead><tbody><tr><td><code>C3D_ENTITY<\/code><\/td><td>Un objeto (modelo o malla)<\/td><td><code>g3d_entity_spawn<\/code>, <code>g3d_model_spawn<\/code><\/td><\/tr><tr><td><code>C3D_LIGHT<\/code><\/td><td>Una luz<\/td><td><code>g3d_light_create<\/code><\/td><\/tr><tr><td><code>C3D_CAMERA<\/code><\/td><td>Una cámara<\/td><td><code>g3d_camera_create<\/code><\/td><\/tr><tr><td><code>C3D_SPRITE<\/code><\/td><td>Un gráfico 2D plantado en el mundo<\/td><td><code>g3d_sprite_create<\/code><\/td><\/tr><tr><td><code>C3D_WATER<\/code><\/td><td>El agua entera del mundo<\/td><td>—<\/td><\/tr><tr><td><code>C3D_CLOTH<\/code><\/td><td>Una tela (bandera, cortina)<\/td><td>—<\/td><\/tr><tr><td><code>C3D_ROPE<\/code><\/td><td>Una cuerda<\/td><td>—<\/td><\/tr><tr><td><code>C3D_SCATTER<\/code><\/td><td>Una especie de vegetación sembrada<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"variables-comunes-todas-las-que-tienen-posici-n\">Variables comunes (todas las que tienen posición)<\/h2>\n<div class=\"tabla\"><table><thead><tr><th>Variable<\/th><th>Unidad<\/th><th>Efecto<\/th><\/tr><\/thead><tbody><tr><td><code>x<\/code>, <code>y<\/code>, <code>z<\/code><\/td><td>unidades de mundo<\/td><td>posición<\/td><\/tr><tr><td><code>angle_x<\/code>, <code>angle_y<\/code>, <code>angle_z<\/code><\/td><td><strong>milésimas de grado<\/strong> (90000 = 90°)<\/td><td>rotación<\/td><\/tr><tr><td><code>size<\/code><\/td><td>porcentaje (100 = tamaño normal)<\/td><td>escala uniforme<\/td><\/tr><tr><td><code>size_x<\/code>, <code>size_y<\/code>, <code>size_z<\/code><\/td><td>porcentaje<\/td><td>escala por eje; si valen 100 manda <code>size<\/code><\/td><\/tr><tr><td><code>alpha<\/code><\/td><td>0 a 255<\/td><td>opacidad<\/td><\/tr><tr><td><code>color_r<\/code>, <code>color_g<\/code>, <code>color_b<\/code><\/td><td>0 a 255<\/td><td>tinte (255,255,255 = sin tinte)<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"entidad\">Entidad<\/h2>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">PROCESS caja()\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, 0.0, 0.0, 0.0);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n    size = 150;                      // un 50 % más grande\n    color_r = 255; color_g = 120; color_b = 120;   // tinte rojizo\n    LOOP\n        angle_y += 500;              // medio grado por frame\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<h2 id=\"luz\">Luz<\/h2>\n<p>La dirección de una luz es <strong><code>target<\/code> menos la posición<\/strong>. Para el sol basta con dejar <code>x,y,z<\/code> en 0 y poner <code>target<\/code> como la dirección en la que viaja la luz.<\/p>\n<div class=\"tabla\"><table><thead><tr><th>Variable<\/th><th>Efecto<\/th><\/tr><\/thead><tbody><tr><td><code>target_x/y/z<\/code><\/td><td>hacia dónde apunta (luz direccional o foco)<\/td><\/tr><tr><td><code>intensity<\/code><\/td><td>intensidad (por debajo de 0 se trata como 0)<\/td><\/tr><tr><td><code>range<\/code><\/td><td>alcance (luces puntuales y focos)<\/td><\/tr><tr><td><code>cone_angle<\/code><\/td><td>ángulo del cono de un foco, en grados<\/td><\/tr><tr><td><code>color_r/g/b<\/code><\/td><td>color, de 0 a 255<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">PROCESS linterna()\nBEGIN\n    ctype = C_3D; csubtype = C3D_LIGHT;\n    entity = g3d_light_create(G3D_LIGHT_SPOT);\n    x = 0.0; y = 4.0; z = 0.0;\n    target_x = 0.0; target_y = 0.0; target_z = 0.0;   // mira hacia el suelo\n    cone_angle = 35.0;\n    range = 12.0;\n    intensity = 2.0;\n    LOOP FRAME; END\nEND<\/code><\/pre><\/div>\n<h2 id=\"c-mara\">Cámara<\/h2>\n<div class=\"tabla\"><table><thead><tr><th>Variable<\/th><th>Efecto<\/th><\/tr><\/thead><tbody><tr><td><code>x,y,z<\/code><\/td><td>posición de la cámara<\/td><\/tr><tr><td><code>target_x/y/z<\/code><\/td><td>punto al que mira<\/td><\/tr><tr><td><code>fov<\/code><\/td><td>campo de visión vertical, <strong>en grados<\/strong> (por defecto 60)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Para una cámara que sigue algo, cambia <code>x,y,z<\/code> y <code>target<\/code> en el <code>LOOP<\/code>:<\/p>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">PROCESS camara_sigue(int objetivo_entity)\nPRIVATE float ox; float oy; float oz;\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    LOOP\n        g3d_entity_get_position(objetivo_entity, &amp;ox, &amp;oy, &amp;oz);\n        target_x = ox; target_y = oy + 1.0; target_z = oz;\n        x = ox; y = oy + 4.0; z = oz - 8.0;\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<blockquote>Con la cámara hecha proceso, <code>fov<\/code> (por defecto 60) se vuelve a aplicar cada frame. Si quieres otro ángulo, ponlo en la variable <code>fov<\/code> del proceso en vez de llamar a <code>g3d_camera_set_fov<\/code>.<\/blockquote>\n<h2 id=\"agua-tela-cuerda-y-vegetaci-n\">Agua, tela, cuerda y vegetación<\/h2>\n<p>Estos procesos <strong>son<\/strong> el elemento entero, no una instancia:<\/p>\n<ul><li><code>C3D_WATER<\/code>: parámetros en la estructura <code>water<\/code> (<code>water.waves<\/code>, <code>water.wave_len<\/code>, <code>water.wave_speed<\/code>,<\/li><\/ul>\n<p>  <code>water.foam<\/code>, <code>water.surf<\/code>, <code>water.splash<\/code>, <code>water.evaporation<\/code>, <code>water.flow<\/code>).<\/p>\n<ul><li><code>C3D_CLOTH<\/code> y <code>C3D_ROPE<\/code>: <code>wind<\/code> es la fuerza del viento y <code>target_x/y/z<\/code> hacia dónde sopla.<\/li><li><code>C3D_SCATTER<\/code>: <code>wind<\/code> (balanceo), <code>draw_dist<\/code> (distancia a la que deja de dibujarse) y <code>solid<\/code><\/li><\/ul>\n<p>  (si bloquea el paso).<\/p>"},{"id":"03-unidades","t":"Unidades y convenciones","h":"<h1 id=\"unidades-y-convenciones\">Unidades y convenciones<\/h1>\n<p>Es la fuente más habitual de errores, así que conviene tenerlo a mano.<\/p>\n<h2 id=\"ngulos\">Ángulos<\/h2>\n<div class=\"tabla\"><table><thead><tr><th>Dónde<\/th><th>Unidad<\/th><\/tr><\/thead><tbody><tr><td><code>angle_x/y/z<\/code> de un proceso, <code>g3d_entity_set_rotation<\/code>, <code>g3d_model_spawn<\/code> (giro)<\/td><td><strong>milésimas de grado<\/strong> (90000 = 90°)<\/td><\/tr><tr><td><code>g3d_rigidbody_angle_x/y/z<\/code>, <code>g3d_vehicle_yaw/pitch/roll<\/code><\/td><td>milésimas de grado<\/td><\/tr><tr><td><code>g3d_vehicle_create<\/code> (rumbo), <code>g3d_sprite_dir<\/code> (ángulo)<\/td><td>milésimas de grado<\/td><\/tr><tr><td><code>fov<\/code> de la cámara, <code>g3d_camera_set_fov<\/code><\/td><td><strong>grados<\/strong><\/td><\/tr><tr><td><code>cone_angle<\/code> de un foco, <code>g3d_light_set_cone<\/code><\/td><td>grados<\/td><\/tr><tr><td><code>g3d_char_set_tuning<\/code> (pendiente), <code>g3d_vehicle_set_tuning<\/code> (giro máximo)<\/td><td>grados<\/td><\/tr><tr><td><code>g3d_collider_add_model_yaw<\/code> (giro)<\/td><td>grados<\/td><\/tr><tr><td><code>g3d_model_orient<\/code><\/td><td><strong>radianes<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Un truco: las rotaciones que salen del motor (<code>g3d_rigidbody_angle_*<\/code>) ya vienen en milésimas de grado <strong>para que se las pases tal cual<\/strong> a <code>g3d_entity_set_rotation<\/code>.<\/p>\n<h2 id=\"escala-color-opacidad\">Escala, color, opacidad<\/h2>\n<div class=\"tabla\"><table><thead><tr><th>Qué<\/th><th>Unidad<\/th><\/tr><\/thead><tbody><tr><td><code>size<\/code>, <code>size_x/y/z<\/code> (proceso)<\/td><td>porcentaje (100 = tamaño normal)<\/td><\/tr><tr><td><code>g3d_entity_set_scale<\/code> (entidad sin proceso)<\/td><td>factor (1.0 = tamaño normal)<\/td><\/tr><tr><td><code>alpha<\/code>, <code>g3d_entity_set_alpha<\/code><\/td><td>0 a 255<\/td><\/tr><tr><td><code>color_r/g/b<\/code>, <code>g3d_entity_set_color<\/code><\/td><td>0 a 255<\/td><\/tr><tr><td><code>g3d_light_set_color<\/code><\/td><td>0.0 a 1.0<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"ejes\">Ejes<\/h2>\n<p>Y es hacia <strong>arriba<\/strong>. El suelo es el plano X-Z. La gravedad tira hacia -Y.<\/p>\n<p><strong>Izquierda y derecha dependen de hacia dónde mira la cámara.<\/strong> La proyección es la estándar de OpenGL:<\/p>\n<div class=\"tabla\"><table><thead><tr><th>La cámara mira hacia...<\/th><th>+X queda a la...<\/th><\/tr><\/thead><tbody><tr><td><strong>+Z<\/strong> (cámara detrás, en z negativa)<\/td><td><strong>izquierda<\/strong><\/td><\/tr><tr><td><strong>-Z<\/strong> (cámara delante, en z positiva)<\/td><td><strong>derecha<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Esto se comprobó con una imagen: con la cámara en <code>z = -8<\/code> mirando al origen, un cubo en <code>x = +3<\/code> se ve a la <strong>izquierda<\/strong>. Por eso, en un juego visto desde atrás (mirando a +Z), \"ir a la derecha\" es <code>-X<\/code>; y en uno lateral conviene poner la cámara en z positiva para que +X sea la derecha de la pantalla.<\/p>\n<p>El <strong>rumbo<\/strong> (vehículo, carretera) vale 0 mirando a +Z y crece hacia +X, es decir, hacia la izquierda de la pantalla si la cámara está detrás. Un rumbo creciente es un giro <strong>a la izquierda<\/strong> visto desde atrás.<\/p>\n<h2 id=\"identificadores\">Identificadores<\/h2>\n<p>Casi todas las funciones <code>*_create<\/code> devuelven un número que identifica lo creado (escena, cámara, luz, entidad, personaje, cuerpo...). Cada tipo numera por separado y empieza en 0, así que <strong>0 es un identificador válido<\/strong>. Cuando falla devuelven <code>-1<\/code>.<\/p>\n<p>Los <strong>modelos<\/strong> y <strong>mallas<\/strong> (<code>g3d_load_gltf<\/code>, <code>g3d_primitive_cube<\/code>...) devuelven un identificador opaco que solo sirve para pasárselo a otras funciones (<code>g3d_model_spawn<\/code>, <code>g3d_entity_set_mesh<\/code>...).<\/p>\n<h2 id=\"tiempo\">Tiempo<\/h2>\n<p>Las funciones de simulación (<code>g3d_char_update<\/code>, <code>g3d_rigidbody_step<\/code>, <code>g3d_vehicle_update<\/code>) reciben <code>dt<\/code> en <strong>segundos<\/strong>. Si pasas un <code>dt<\/code> demasiado grande se recorta (0.05 s en el personaje y en los cuerpos rígidos, 0.1 s en el vehículo), para que un tirón no rompa la simulación.<\/p>"},{"id":"04-personaje","t":"Un personaje que camina","h":"<h1 id=\"un-personaje-que-camina\">Un personaje que camina<\/h1>\n<p>El controlador de personaje (<code>g3d_char_*<\/code>) es una <strong>cápsula<\/strong> que camina por el terreno y por las cajas de colisión, con gravedad, saltos y escalones. No dibuja nada: tú le pones un modelo encima.<\/p>\n<p>El ciclo es siempre el mismo: <strong>pedir movimiento → actualizar → leer la posición<\/strong>.<\/p>\n<div class=\"bloque\"><span class=\"verif\" title=\"Este ejemplo se compila con bgdc al generar la documentacion\">compila<\/span><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">import &quot;libmod_gfx&quot;; import &quot;libmod_misc&quot;; import &quot;libmod_input&quot;; import &quot;libmod_3d&quot;;\n\nGLOBAL\n    int escena;\n    int camara;\n\nCONST\n    VELOCIDAD = 6.0;     // unidades por segundo\n    SALTO     = 9.0;     // velocidad inicial del salto\n    DT        = 0.0166;  // un frame a 60 fps, en segundos\nEND\n\nPROCESS sol()\nBEGIN\n    ctype = C_3D; csubtype = C3D_LIGHT;\n    entity = g3d_light_create(G3D_LIGHT_DIRECTIONAL);\n    target_x = 0.4; target_y = -0.8; target_z = 0.3;\n    intensity = 0.6;                  // por defecto es 1.0 y los objetos blancos salen quemados\n    LOOP FRAME; END\nEND\n\nPROCESS camara_tercera(int objetivo)\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    LOOP\n        target_x = g3d_char_x(objetivo);\n        target_y = g3d_char_y(objetivo) + 1.0;\n        target_z = g3d_char_z(objetivo);\n        x = target_x;\n        y = target_y + 4.0;\n        z = target_z - 8.0;\n        FRAME;\n    END\nEND\n\n// El personaje: una cápsula invisible con un cubo encima para verla.\nPROCESS jugador()\nPRIVATE\n    int pj;          // id del controlador de personaje\n    float vx; float vz;\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, 0.0, 0.0, 0.0);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n\n    // x, y, z (pies), radio y altura de la cápsula\n    pj = g3d_char_create(0.0, 2.0, 0.0, 0.4, 1.8);\n\n    // Camara que lo sigue (el id del personaje es lo que necesita)\n    camara_tercera(pj);\n\n    LOOP\n        vx = 0.0; vz = 0.0;\n        // La cámara va detrás mirando a +Z, y desde ahí +X queda a la IZQUIERDA: ir a la derecha es -X.\n        IF (key(_D)) vx = -VELOCIDAD; END\n        IF (key(_A)) vx =  VELOCIDAD; END\n        IF (key(_W)) vz =  VELOCIDAD; END\n        IF (key(_S)) vz = -VELOCIDAD; END\n\n        g3d_char_move(pj, vx, vz);                    // velocidad deseada en el plano X,Z\n        IF (key(_SPACE) AND g3d_char_grounded(pj)) g3d_char_jump(pj, SALTO); END\n        g3d_char_update(pj, DT);                      // aplica gravedad y colisiones\n\n        x = g3d_char_x(pj); y = g3d_char_y(pj); z = g3d_char_z(pj);\n        FRAME;\n    END\nEND\n\nPROCESS main()\nBEGIN\n    escena = g3d_scene_create(&quot;mundo&quot;);\n    g3d_scene_set_active(escena);\n    camara = g3d_camera_create();\n    g3d_camera_set_active(camara);\n\n    g3d_sky_set_gradient(0.25, 0.45, 0.85, 0.75, 0.85, 0.95);   // sin cielo la pantalla sale NEGRA\n    g3d_sky_enable(1);\n\n    // Un suelo de colisión: una caja de -50 a 50 en X y Z, de -1 a 0 en Y.\n    g3d_collider_add_box(-50.0, -1.0, -50.0, 50.0, 0.0, 50.0);\n\n    sol();\n    jugador();\n\n    LOOP\n        IF (key(_ESC)) exit(); END\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<h2 id=\"piezas-clave\">Piezas clave<\/h2>\n<ul><li><strong><code>g3d_char_create(x, y, z, radio, alto)<\/code><\/strong> crea la cápsula y devuelve su id.<\/li><li><strong><code>g3d_char_move(pj, vx, vz)<\/code><\/strong> no mueve nada por sí sola: guarda la velocidad deseada para el<\/li><\/ul>\n<p>  siguiente <code>g3d_char_update<\/code>.<\/p>\n<ul><li><strong><code>g3d_char_update(pj, dt)<\/code><\/strong> hace la simulación. Llámala una vez por frame.<\/li><li><strong><code>g3d_char_grounded(pj)<\/code><\/strong> vale 1 si está en el suelo; úsala para permitir el salto.<\/li><li>El personaje camina por el <strong>terreno<\/strong> de la escena cargada y por las <strong>cajas<\/strong> de<\/li><\/ul>\n<p>  <code>g3d_collider_add_box<\/code>. Para un nivel con mallas, usa <a href=\"#api/g3d_collider_add_model\">g3d_collider_add_model<\/a>.<\/p>\n<h2 id=\"ajustes-tiles\">Ajustes útiles<\/h2>\n<div class=\"tabla\"><table><thead><tr><th>Quieres...<\/th><th>Usa<\/th><\/tr><\/thead><tbody><tr><td>Subir escalones más altos, o pendientes más fuertes<\/td><td><code>g3d_char_set_tuning(pj, escalon, pendiente_grados)<\/code><\/td><\/tr><tr><td>Que empuje cajas y barriles<\/td><td><code>g3d_char_set_push(pj, fuerza)<\/code><\/td><\/tr><tr><td>Teletransportarlo<\/td><td><code>g3d_char_set_position(pj, x, y, z)<\/code><\/td><\/tr><tr><td>Nadar<\/td><td><code>g3d_char_set_water(pj, 1, altura_del_agua)<\/code> cada frame<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"05-fisica","t":"Cuerpos rígidos (física)","h":"<h1 id=\"cuerpos-r-gidos-f-sica\">Cuerpos rígidos (física)<\/h1>\n<p>Un <strong>cuerpo rígido<\/strong> es un objeto que obedece a la física: cae, rebota, se apila y se deja empujar. Se crea con <code>g3d_rigidbody_create*<\/code>, se avanza con <code>g3d_rigidbody_step<\/code> y se <strong>lee su posición<\/strong> para mover el modelo que lo representa.<\/p>\n<blockquote>En PC la física la hace <a href=\"https://github.com/jrouwe/JoltPhysics\" rel=\"noopener\" target=\"_blank\">Jolt<\/a>. En Vita y PS5 se usa un motor propio más simple; algunas funciones (mallas exactas, envolventes convexas) solo existen con Jolt.<\/blockquote>\n<div class=\"bloque\"><span class=\"verif\" title=\"Este ejemplo se compila con bgdc al generar la documentacion\">compila<\/span><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">import &quot;libmod_gfx&quot;; import &quot;libmod_misc&quot;; import &quot;libmod_input&quot;; import &quot;libmod_3d&quot;;\n\nGLOBAL\n    int escena;\n    int camara;\n\nPROCESS sol()\nBEGIN\n    ctype = C_3D; csubtype = C3D_LIGHT;\n    entity = g3d_light_create(G3D_LIGHT_DIRECTIONAL);\n    target_x = 0.4; target_y = -0.8; target_z = 0.3;\n    intensity = 0.6;                  // por defecto es 1.0 y los objetos blancos salen quemados\n    LOOP FRAME; END\nEND\n\nPROCESS camara_fija()\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    x = 0.0; y = 6.0; z = -14.0;\n    target_x = 0.0; target_y = 2.0; target_z = 0.0;\n    LOOP FRAME; END\nEND\n\n// Una caja que cae. El proceso copia la posición y el giro del cuerpo a su modelo.\nPROCESS caja(float px, float py, float pz)\nPRIVATE int cuerpo;\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, px, py, pz);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n\n    // posición, MEDIAS dimensiones (la mitad de cada lado) y masa\n    cuerpo = g3d_rigidbody_create(px, py, pz, 0.5, 0.5, 0.5, 10.0);\n    g3d_rigidbody_set_bounce(cuerpo, 0.3, 0.6);   // rebote y rozamiento\n\n    LOOP\n        x = g3d_rigidbody_render_x(cuerpo);\n        y = g3d_rigidbody_render_y(cuerpo);\n        z = g3d_rigidbody_render_z(cuerpo);\n        // los ángulos ya salen en milésimas de grado, listos para angle_*\n        angle_x = g3d_rigidbody_angle_x(cuerpo);\n        angle_y = g3d_rigidbody_angle_y(cuerpo);\n        angle_z = g3d_rigidbody_angle_z(cuerpo);\n        FRAME;\n    END\nEND\n\nPROCESS main()\nPRIVATE int i;\nBEGIN\n    escena = g3d_scene_create(&quot;fisica&quot;);\n    g3d_scene_set_active(escena);\n    camara = g3d_camera_create();\n    g3d_camera_set_active(camara);\n\n    g3d_sky_set_gradient(0.25, 0.45, 0.85, 0.75, 0.85, 0.95);   // sin cielo la pantalla sale NEGRA\n    g3d_sky_enable(1);\n\n    // Un suelo: masa 0 = cuerpo FIJO (choca con todo, no lo mueve nada).\n    g3d_rigidbody_create(0.0, -0.5, 0.0, 50.0, 0.5, 50.0, 0.0);\n\n    sol();\n    camara_fija();\n\n    // Una torre de cajas\n    FOR (i = 0; i &lt; 6; i++)\n        caja(0.0, 1.0 + i * 1.2, 0.0);\n    END\n\n    LOOP\n        g3d_rigidbody_step(0.0166);                   // una vez por frame\n        IF (key(_SPACE))                              // empujón a la torre\n            g3d_rigidbody_apply_impulse(0, 0.0, 60.0, 20.0);\n        END\n        IF (key(_ESC)) exit(); END\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<h2 id=\"piezas-clave\">Piezas clave<\/h2>\n<ul><li><strong>Medias dimensiones.<\/strong> <code>g3d_rigidbody_create(x, y, z, hx, hy, hz, masa)<\/code> toma la *mitad* de cada<\/li><\/ul>\n<p>  lado: una caja de 1×1×1 son <code>0.5, 0.5, 0.5<\/code>.<\/p>\n<ul><li><strong>Masa 0 = fijo.<\/strong> Sirve para suelos, paredes y decorado sólido.<\/li><li>**<code>g3d_rigidbody_render_*<\/code> en vez de <code>g3d_rigidbody_x/y/z<\/code>.** Los primeros dan dónde dibujar un modelo<\/li><\/ul>\n<p>  con el origen en los pies; los segundos son el centro del cuerpo. Si tu modelo tiene el origen en   otro sitio, ajústalo con <code>g3d_rigidbody_set_model_offset<\/code>.<\/p>\n<ul><li><strong>Un cuerpo dormido ignora lo que no le despierta.<\/strong> Los impulsos y <code>set_velocity<\/code> ya lo despiertan solos.<\/li><li><strong>Formas:<\/strong> caja, esfera, cápsula y cilindro; y <code>g3d_rigidbody_create_convex_model<\/code> para ajustarse a<\/li><\/ul>\n<p>  un modelo (barriles, rocas).<\/p>\n<h2 id=\"flotar\">Flotar<\/h2>\n<p><code>g3d_rigidbody_set_buoyancy(cuerpo, nivel_agua, densidad)<\/code> con densidad relativa al agua: menor que 1 flota, 1 queda a flor, mayor que 1 se hunde. El empuje se reparte por el volumen sumergido, así que un cuerpo ancho y bajo aguanta y uno alto y estrecho vuelca.<\/p>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">g3d_rigidbody_set_buoyancy(barril, g3d_scene_water_level(), 0.6);   // flota<\/code><\/pre><\/div>\n<h2 id=\"nivel-con-colisi-n-exacta\">Nivel con colisión exacta<\/h2>\n<p>Para dar colisión a un nivel importado con una sola llamada:<\/p>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">nivel = g3d_load_gltf(&quot;Assets/Models/nivel.glb&quot;);\ng3d_collider_add_model(nivel, 0.0, 0.0, 0.0, 1.0);   // malla exacta, estática<\/code><\/pre><\/div>"},{"id":"06-modelos","t":"Modelos y animación","h":"<h1 id=\"modelos-y-animaci-n\">Modelos y animación<\/h1>\n<p>Cargar un modelo da un <strong>identificador de modelo<\/strong>. Para verlo hay que <strong>colocarlo<\/strong> en una escena (<code>g3d_model_spawn<\/code>), lo que crea una entidad raíz de la que cuelgan todas sus mallas.<\/p>\n<div class=\"bloque\"><span class=\"verif\" title=\"Este ejemplo se compila con bgdc al generar la documentacion\">compila<\/span><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">import &quot;libmod_gfx&quot;; import &quot;libmod_misc&quot;; import &quot;libmod_input&quot;; import &quot;libmod_3d&quot;;\n\nGLOBAL\n    int escena;\n    int camara;\n\nPROCESS camara_fija()\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    x = 0.0; y = 2.0; z = -5.0;\n    target_x = 0.0; target_y = 1.0; target_z = 0.0;\n    LOOP FRAME; END\nEND\n\nPROCESS personaje()\nPRIVATE\n    int modelo;\n    int cuenta;       // número de animaciones\n    float t;          // tiempo de la animación\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n\n    modelo = g3d_load_gltf(&quot;Assets/Models/personaje.glb&quot;);\n    IF (modelo &lt; 0) exit(&quot;No se pudo cargar el modelo&quot;, 1); END\n\n    // Lo coloca en la escena con 1.8 de alto y sin giro.\n    entity = g3d_model_spawn(escena, modelo, 0.0, 0.0, 0.0, 1.8, 0.0);\n\n    g3d_model_lock_root(modelo, 1);         // la animación no desplaza al personaje\n    cuenta = g3d_model_anim_count(modelo);\n\n    LOOP\n        t += 0.0166;\n        IF (cuenta &gt; 0)\n            g3d_model_animate(modelo, 0, t, 1);   // animación 0, con bucle\n        END\n        angle_y += 500;\n        FRAME;\n    END\nEND\n\nPROCESS main()\nBEGIN\n    escena = g3d_scene_create(&quot;modelos&quot;);\n    g3d_scene_set_active(escena);\n    camara = g3d_camera_create();\n    g3d_camera_set_active(camara);\n\n    g3d_sky_set_gradient(0.25, 0.45, 0.85, 0.75, 0.85, 0.95);   // sin cielo la pantalla sale NEGRA\n    g3d_sky_enable(1);\n    camara_fija();\n    personaje();\n    LOOP\n        IF (key(_ESC)) exit(); END\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<blockquote>Cambia <code>Assets/Models/personaje.glb<\/code> por un modelo tuyo. También se leen FBX (<code>g3d_load_fbx<\/code>), OBJ (<code>g3d_load_obj<\/code>) y MD3 (<code>g3d_load_md3<\/code>).<\/blockquote>\n<h2 id=\"mezclar-animaciones\">Mezclar animaciones<\/h2>\n<p>Para pasar suavemente de quieto a andar, mezcla dos animaciones con un peso de 0 a 1:<\/p>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">peso = velocidad / 6.0;                  // 0 = quieto, 1 = corriendo\ng3d_model_animate_blend(modelo, ANIM_QUIETO, t, ANIM_CORRER, t, peso, 1);<\/code><\/pre><\/div>\n<h2 id=\"acoplar-un-objeto-a-un-hueso\">Acoplar un objeto a un hueso<\/h2>\n<p>Busca el hueso una vez y lee su posición cada frame, <strong>después<\/strong> de animar:<\/p>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">mano = g3d_model_node_find(modelo, &quot;hand_r&quot;);       // ignora mayúsculas, vale un trozo del nombre\n...\ng3d_model_animate(modelo, 0, t, 1);\narma.x = g3d_model_node_x(modelo, mano);\narma.y = g3d_model_node_y(modelo, mano);\narma.z = g3d_model_node_z(modelo, mano);<\/code><\/pre><\/div>\n<h2 id=\"quitar-un-modelo\">Quitar un modelo<\/h2>\n<p><code>g3d_model_despawn(raiz)<\/code> destruye la raíz, todas sus mallas y sus materiales privados. Úsalo siempre que crees y quites modelos continuamente (proyectiles, enemigos) para no agotar los huecos del motor.<\/p>"},{"id":"07-sprites","t":"Sprites 2D en el mundo 3D (HD-2D)","h":"<h1 id=\"sprites-2d-en-el-mundo-3d-hd-2d\">Sprites 2D en el mundo 3D (HD-2D)<\/h1>\n<p>Un <code>C3D_SPRITE<\/code> es un gráfico 2D normal de BennuGD2 plantado en la escena 3D. Siempre mira a la cámara, tapa y es tapado por la geometría 3D, y se anima como en 2D: <strong>cambiando <code>graph<\/code><\/strong>. El estilo de los juegos \"HD-2D\": personajes dibujados sobre un mundo en 3D.<\/p>\n<div class=\"bloque\"><span class=\"verif\" title=\"Este ejemplo se compila con bgdc al generar la documentacion\">compila<\/span><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">import &quot;libmod_gfx&quot;; import &quot;libmod_misc&quot;; import &quot;libmod_input&quot;; import &quot;libmod_3d&quot;;\n\nGLOBAL\n    int escena;\n    int camara;\n\nPROCESS camara_fija()\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    x = 0.0; y = 3.0; z = -8.0;\n    target_x = 0.0; target_y = 1.0; target_z = 0.0;\n    LOOP FRAME; END\nEND\n\n// Un sprite de ejemplo dibujado por código (en un juego real, cargas un PNG o un FPG).\nPROCESS heroe()\nBEGIN\n    ctype = C_3D; csubtype = C3D_SPRITE;\n\n    graph = map_new(16, 32);                       // un gráfico de 16x32 píxeles\n    map_clear(0, graph, rgb(220, 60, 60));         // lo rellena de rojo\n\n    entity = g3d_sprite_create(escena, 0.0, 0.0, 0.0);\n    g3d_sprite_set_pixels_per_unit(entity, 16.0);  // 16 píxeles = 1 unidad: mide 2 de alto\n    g3d_sprite_set_anchor(entity, 0.5, 1.0);       // los pies, en x,y,z\n    g3d_sprite_set_billboard(entity, G3D_SPRITE_UPRIGHT);\n\n    LOOP\n        x += 0.02;                                 // se mueve como cualquier proceso\n        IF (x &gt; 3.0) x = -3.0; END\n        FRAME;\n    END\nEND\n\nPROCESS main()\nBEGIN\n    escena = g3d_scene_create(&quot;hd2d&quot;);\n    g3d_scene_set_active(escena);\n    camara = g3d_camera_create();\n    g3d_camera_set_active(camara);\n\n    g3d_sky_set_gradient(0.25, 0.45, 0.85, 0.75, 0.85, 0.95);   // sin cielo la pantalla sale NEGRA\n    g3d_sky_enable(1);\n    camara_fija();\n    heroe();\n    LOOP\n        IF (key(_ESC)) exit(); END\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<h2 id=\"piezas-clave\">Piezas clave<\/h2>\n<ul><li><strong>El gráfico lo manda <code>graph<\/code> (y <code>file<\/code>)<\/strong>, igual que en 2D. Para animar, cambia <code>graph<\/code> entre los<\/li><\/ul>\n<p>  fotogramas de un FPG, o usa una hoja de sprites (ver más abajo).<\/p>\n<ul><li><strong>Tamaño:<\/strong> <code>g3d_sprite_set_pixels_per_unit<\/code> (cómodo para pixel art) o <code>g3d_sprite_set_height<\/code>.<\/li><li><strong>Ancla:<\/strong> <code>(0.5, 1.0)<\/code> = centro-abajo, los pies del personaje sobre el suelo. Si el gráfico trae el<\/li><\/ul>\n<p>  punto de control 0, se usa ese.<\/p>\n<ul><li><strong>Orientación:<\/strong> <code>G3D_SPRITE_UPRIGHT<\/code> gira solo en horizontal y sigue de pie (personajes);<\/li><\/ul>\n<p>  <code>G3D_SPRITE_FACING<\/code> mira siempre de frente (objetos, efectos).<\/p>\n<ul><li><strong>Pixel art nítido:<\/strong> por defecto el filtrado es *nearest* y la posición se redondea a píxeles enteros<\/li><\/ul>\n<p>  (<code>g3d_sprite_set_smooth<\/code> y <code>g3d_sprite_set_snap<\/code> lo cambian).<\/p>\n<ul><li><strong>Sombra y luz:<\/strong> <code>g3d_sprite_set_shadow(sprite, 1)<\/code> proyecta sombra; por defecto la luz de la escena le<\/li><\/ul>\n<p>  afecta (<code>g3d_sprite_set_lit<\/code>).<\/p>\n<h2 id=\"hojas-de-sprites\">Hojas de sprites<\/h2>\n<p>Un solo gráfico partido en celdas. Con las variables de la estructura <code>sprite<\/code> del proceso:<\/p>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">sprite.cols = 4; sprite.rows = 2;     // la hoja tiene 4 columnas y 2 filas\nLOOP\n    contador++;\n    sprite.frame = (contador / 6) % 8; // fotograma que se dibuja\n    FRAME;\nEND<\/code><\/pre><\/div>\n<h2 id=\"varias-direcciones\">Varias direcciones<\/h2>\n<p><code>g3d_sprite_dir(sprite, angulo, ndirs)<\/code> dice qué postura dibujar según desde dónde se mira (0 = de frente a la cámara). El ángulo va en milésimas de grado, como la variable <code>angle<\/code>.<\/p>"},{"id":"08-vehiculo","t":"Un vehículo","h":"<h1 id=\"un-veh-culo\">Un vehículo<\/h1>\n<p>El vehículo (<code>g3d_vehicle_*<\/code>) es un coche <strong>arcade<\/strong>: dirección tipo bicicleta y las cuatro ruedas siguiendo el terreno. No es un cuerpo rígido de Jolt: es un controlador propio, rápido y fácil de conducir.<\/p>\n<div class=\"bloque\"><span class=\"verif\" title=\"Este ejemplo se compila con bgdc al generar la documentacion\">compila<\/span><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">import &quot;libmod_gfx&quot;; import &quot;libmod_misc&quot;; import &quot;libmod_input&quot;; import &quot;libmod_3d&quot;;\n\nGLOBAL\n    int escena;\n    int camara;\n\nPROCESS camara_sigue(int coche)\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    LOOP\n        target_x = g3d_vehicle_x(coche);\n        target_y = g3d_vehicle_y(coche);\n        target_z = g3d_vehicle_z(coche);\n        x = target_x; y = target_y + 8.0; z = target_z - 14.0;\n        FRAME;\n    END\nEND\n\nPROCESS coche()\nPRIVATE\n    int v;                 // id del vehículo\n    float acel; float giro; float freno;\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, 0.0, 0.0, 0.0);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n\n    // x, y, z y rumbo (en milésimas de grado)\n    v = g3d_vehicle_create(0.0, 1.0, 0.0, 0);\n\n    // motor, velocidad máxima, giro máximo (grados), freno y resistencia\n    g3d_vehicle_set_tuning(v, 30.0, 60.0, 32.0, 40.0, 0.8);\n\n    camara_sigue(v);\n\n    LOOP\n        acel = 0.0; giro = 0.0; freno = 0.0;\n        IF (key(_UP))    acel =  1.0; END\n        IF (key(_DOWN))  acel = -1.0; END\n        // dirección positiva = el rumbo crece hacia +X; con la cámara detrás eso es girar a la IZQUIERDA\n        IF (key(_LEFT))  giro =  1.0; END\n        IF (key(_RIGHT)) giro = -1.0; END\n        IF (key(_SPACE)) freno = 1.0; END\n\n        g3d_vehicle_update(v, 0.0166, acel, giro, freno);\n\n        x = g3d_vehicle_x(v); y = g3d_vehicle_y(v); z = g3d_vehicle_z(v);\n        angle_y = g3d_vehicle_yaw(v);       // ya viene en milésimas de grado\n        angle_x = g3d_vehicle_pitch(v);\n        angle_z = g3d_vehicle_roll(v);\n        FRAME;\n    END\nEND\n\nPROCESS main()\nBEGIN\n    escena = g3d_scene_create(&quot;carrera&quot;);\n    g3d_scene_set_active(escena);\n    camara = g3d_camera_create();\n    g3d_camera_set_active(camara);\n\n    g3d_sky_set_gradient(0.25, 0.45, 0.85, 0.75, 0.85, 0.95);   // sin cielo la pantalla sale NEGRA\n    g3d_sky_enable(1);\n    coche();\n    LOOP\n        IF (key(_ESC)) exit(); END\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<h2 id=\"piezas-clave\">Piezas clave<\/h2>\n<ul><li><strong><code>g3d_vehicle_update(v, dt, acelerador, direccion, freno)<\/code><\/strong>: acelerador de -1 (marcha atrás) a 1,<\/li><\/ul>\n<p>  dirección de -1 a 1 (<strong>positiva = hacia +X<\/strong>, a la izquierda de quien mira hacia +Z) y freno de 0 a 1. Los valores fuera de rango se recortan.<\/p>\n<ul><li><strong>Cuanta más velocidad, menos giro:<\/strong> la dirección pierde hasta un 40 % de autoridad a máxima velocidad.<\/li><li><strong>El vehículo solo acelera con las ruedas en el suelo.<\/strong><\/li><li><strong>Dimensiones:<\/strong> <code>g3d_vehicle_set_geometry(v, batalla, via, altura)<\/code>. Valores por defecto: batalla 4.0,<\/li><\/ul>\n<p>  vía 2.4, altura 1.0.<\/p>\n<ul><li><strong>Velocidad:<\/strong> <code>g3d_vehicle_speed(v)<\/code>, con signo (negativa = marcha atrás). Útil para un velocímetro.<\/li><li>Para varios vehículos, cada uno tiene su id (hay un máximo de 8).<\/li><\/ul>"},{"id":"09-plataformas-por-codigo","t":"Un juego de plataformas por código","h":"<h1 id=\"un-juego-de-plataformas-por-c-digo\">Un juego de plataformas por código<\/h1>\n<p>No hay un \"modo plataformas\": un nivel de plataformas es <strong>un nivel dibujado en la escena<\/strong> más <strong>código que lo juega<\/strong>. Dibuja el escenario con las herramientas de mundo (terreno, primitivas, prefabs, modelos) y programa el personaje, las monedas y las reglas.<\/p>\n<p>Este ejemplo lo monta todo por código para mostrar las piezas; en un juego real las plataformas las pondrías en el editor y asignarías un <code>PROCESS<\/code> a cada objeto que deba hacer algo.<\/p>\n<p>Las piezas son tres:<\/p>\n<p>1. <strong>Colisión del escenario.<\/strong> Cada plataforma necesita una caja de colisión (<code>g3d_collider_add_box<\/code>) o    una malla (<code>g3d_collider_add_model<\/code>) para que el personaje pise sobre ella. 2. <strong>El personaje.<\/strong> Un controlador <code>g3d_char_*<\/code> con movimiento solo en un eje (desplazamiento lateral)    y salto. 3. <strong>Las reglas.<\/strong> Recoger cosas, caer al vacío, llegar a la meta: son comprobaciones de distancia y    de altura en un proceso.<\/p>\n<div class=\"bloque\"><span class=\"verif\" title=\"Este ejemplo se compila con bgdc al generar la documentacion\">compila<\/span><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">import &quot;libmod_gfx&quot;; import &quot;libmod_misc&quot;; import &quot;libmod_input&quot;; import &quot;libmod_3d&quot;;\n\nCONST\n    DT        = 0.0166;\n    VELOCIDAD = 7.0;\n    SALTO     = 12.0;\nEND\n\nGLOBAL\n    int escena;\n    int camara;\n    int monedas;        // monedas recogidas\n    int pj;             // controlador del personaje\n\nPROCESS sol()\nBEGIN\n    ctype = C_3D; csubtype = C3D_LIGHT;\n    entity = g3d_light_create(G3D_LIGHT_DIRECTIONAL);\n    target_x = 0.3; target_y = -0.8; target_z = -0.5;   // la luz viaja hacia -Z: ilumina las caras que ve la cámara (en z positiva)\n    intensity = 0.6;                  // por defecto es 1.0 y los objetos blancos salen quemados\n    LOOP FRAME; END\nEND\n\n// Una plataforma: un cubo escalado y su caja de colisión. El cubo mide 1x1x1 y está centrado,\n// así que escalarlo a (ancho, alto, fondo) da exactamente esa caja.\nPROCESS plataforma(float px, float py, float pz, float ancho, float alto, float fondo)\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, px, py, pz);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n    size_x = ancho * 100; size_y = alto * 100; size_z = fondo * 100;   // escala en %: dentro de un proceso la manda &#x27;size&#x27;\n    g3d_collider_add_box(px - ancho / 2, py - alto / 2, pz - fondo / 2,\n                         px + ancho / 2, py + alto / 2, pz + fondo / 2);\n    x = px; y = py; z = pz;\n    LOOP FRAME; END\nEND\n\n// Una moneda: gira y desaparece cuando el personaje se acerca.\nPROCESS moneda(float px, float py)\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, px, py, 0.0);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n    size_x = 0.4 * 100; size_y = 0.4 * 100; size_z = 0.4 * 100;   // escala en %: dentro de un proceso la manda &#x27;size&#x27;\n    x = px; y = py; z = 0.0;\n    LOOP\n        angle_y += 3000;\n        // distancia al personaje (en el plano del juego, X e Y)\n        IF (abs(g3d_char_x(pj) - px) &lt; 0.8 AND abs(g3d_char_y(pj) + 0.9 - py) &lt; 1.2)\n            monedas++;\n            say(&quot;Monedas: &quot; + itoa(monedas));\n            g3d_entity_destroy(entity);\n            BREAK;\n        END\n        FRAME;\n    END\nEND\n\nPROCESS camara_lateral()\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    LOOP\n        target_x = g3d_char_x(pj); target_y = g3d_char_y(pj) + 1.0; target_z = 0.0;\n        // La cámara va en z POSITIVA mirando hacia -Z: así +X queda a la derecha de la pantalla.\n        x = target_x; y = target_y + 1.0; z = 14.0;\n        FRAME;\n    END\nEND\n\nPROCESS heroe()\nPRIVATE float vx;\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, 0.0, 0.0, 0.0);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n    size_x = 0.8 * 100; size_y = 1.8 * 100; size_z = 0.8 * 100;   // escala en %: dentro de un proceso la manda &#x27;size&#x27;\n\n    pj = g3d_char_create(0.0, 3.0, 0.0, 0.4, 1.8);\n\n    LOOP\n        vx = 0.0;\n        IF (key(_RIGHT)) vx =  VELOCIDAD; END\n        IF (key(_LEFT))  vx = -VELOCIDAD; END\n        g3d_char_move(pj, vx, 0.0);                     // solo en X: es un juego lateral\n        IF (key(_SPACE) AND g3d_char_grounded(pj)) g3d_char_jump(pj, SALTO); END\n        g3d_char_update(pj, DT);\n\n        // el cubo mide 1 de alto y está centrado: se sube media altura para apoyarlo en los pies\n        x = g3d_char_x(pj); y = g3d_char_y(pj) + 0.9; z = 0.0;\n\n        // caer al vacío: vuelve al principio\n        IF (g3d_char_y(pj) &lt; -15.0)\n            g3d_char_set_position(pj, 0.0, 3.0, 0.0);\n        END\n        FRAME;\n    END\nEND\n\nPROCESS main()\nBEGIN\n    escena = g3d_scene_create(&quot;plataformas&quot;);\n    g3d_scene_set_active(escena);\n    camara = g3d_camera_create();\n    g3d_camera_set_active(camara);\n\n    g3d_sky_set_gradient(0.25, 0.45, 0.85, 0.75, 0.85, 0.95);   // sin cielo la pantalla sale NEGRA\n    g3d_sky_enable(1);\n\n    sol();\n    // x, y, z (centro), ancho, alto, fondo\n    plataforma( 0.0, -0.5, 0.0, 10.0, 1.0, 4.0);\n    plataforma(11.0,  0.5, 0.0,  4.0, 1.0, 4.0);\n    plataforma(18.0,  2.0, 0.0,  4.0, 1.0, 4.0);\n    plataforma(26.0,  1.0, 0.0,  8.0, 1.0, 4.0);\n\n    moneda(11.0, 2.2);\n    moneda(18.0, 3.7);\n    moneda(26.0, 2.7);\n\n    heroe();\n    camara_lateral();\n\n    LOOP\n        IF (key(_ESC)) exit(); END\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<h2 id=\"c-mo-crecer-desde-aqu\">Cómo crecer desde aquí<\/h2>\n<div class=\"tabla\"><table><thead><tr><th>Quieres...<\/th><th>Usa<\/th><\/tr><\/thead><tbody><tr><td>Plataformas que se mueven<\/td><td>un proceso que cambie <code>x<\/code>, <code>y<\/code> y llame a <code>g3d_collider_set_box(caja, ...)<\/code> cada frame<\/td><\/tr><tr><td>Enemigos<\/td><td>un proceso con su propio controlador <code>g3d_char_*<\/code> y la misma comprobación de distancia<\/td><\/tr><tr><td>Saltar con más control<\/td><td><code>g3d_char_set_tuning<\/code> para escalón y pendiente; <code>g3d_char_set_water<\/code> para nadar<\/td><\/tr><tr><td>Un nivel hecho en el editor<\/td><td><code>g3d_scene_load(\"nivel.scene\")<\/code> y colisión con <code>g3d_collider_add_model<\/code> sobre sus modelos<\/td><\/tr><tr><td>Empujar cajas<\/td><td><code>g3d_char_set_push<\/code> y <a href=\"#guia/05-fisica\">cuerpos rígidos<\/a><\/td><\/tr><tr><td>Saber dónde empieza el jugador<\/td><td><code>g3d_scene_has_spawn()<\/code> y <code>g3d_scene_spawn_x/y/z()<\/code><\/td><\/tr><tr><td>Sprites 2D en vez de cubos<\/td><td><a href=\"#guia/07-sprites\">sprites HD-2D<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><code>g3d_collider_add_box<\/code> devuelve el identificador de la caja; guárdalo si vas a moverla o quitarla (<code>g3d_collider_set_box<\/code>, <code>g3d_collider_remove_box<\/code>).<\/blockquote>"},{"id":"10-carreras-por-codigo","t":"Un juego de carreras por código","h":"<h1 id=\"un-juego-de-carreras-por-c-digo\">Un juego de carreras por código<\/h1>\n<p>No hay un \"modo carreras\". En el editor solo marcas <strong>por dónde se puede circular<\/strong> (la carretera) y todo lo demás es código: dónde salen los coches, la meta, las vueltas, los rivales, los turbos...<\/p>\n<p><strong>La carretera no se dibuja ni cambia el suelo.<\/strong> El aspecto lo pones tú (pintando el terreno con las herramientas de terreno, o poniendo un modelo <code>.glb<\/code>) y la herramienta <strong>Carretera<\/strong> solo marca *por dónde se puede circular*. Esa información se consulta con las funciones <code>g3d_road_*<\/code>. Son pocas y bastan para hacer una carrera completa:<\/p>\n<div class=\"tabla\"><table><thead><tr><th>Pregunta<\/th><th>Función<\/th><\/tr><\/thead><tbody><tr><td>¿Cuánto mide la carretera?<\/td><td><code>g3d_road_length(carretera)<\/code><\/td><\/tr><tr><td>¿Dónde está el punto a *d* metros del principio?<\/td><td><code>g3d_road_x/y/z(carretera, d)<\/code><\/td><\/tr><tr><td>¿Hacia dónde mira la carretera ahí?<\/td><td><code>g3d_road_yaw(carretera, d)<\/code><\/td><\/tr><tr><td>¿Qué ancho tiene? ¿Qué superficie es?<\/td><td><code>g3d_road_width(carretera, d)<\/code>, <code>g3d_road_surface(carretera, d)<\/code><\/td><\/tr><tr><td>¿Dónde estoy respecto a ella?<\/td><td><code>g3d_road_nearest(x, z)<\/code> y luego <code>g3d_road_near_dist()<\/code>, <code>g3d_road_near_offset()<\/code>, <code>g3d_road_near_on()<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>g3d_road_near_dist()<\/code> es la <strong>distancia recorrida<\/strong> del punto más cercano de la carretera, y eso es todo lo que hace falta para saber en qué vuelta va un coche, quién va primero o hacia dónde apuntar un rival.<\/p>\n<h2 id=\"la-carretera\">La carretera<\/h2>\n<p>Una carretera es una lista de nodos (posición, ancho, peralte) unidos por curvas suaves. En un proyecto real la marcas en el editor; aquí la inventamos por código para ver todas las piezas, y como no hay terreno ni modelo que la muestre, la dibujamos con <code>g3d_road_show<\/code> y la hacemos suelo con <code>g3d_road_set_ground<\/code> (en tu juego no harían falta).<\/p>\n<div class=\"bloque\"><span class=\"verif\" title=\"Este ejemplo se compila con bgdc al generar la documentacion\">compila<\/span><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">import &quot;libmod_gfx&quot;; import &quot;libmod_misc&quot;; import &quot;libmod_input&quot;; import &quot;libmod_3d&quot;;\n\nCONST\n    DT        = 0.0166;\n    N_VUELTAS = 3;\nEND\n\nGLOBAL\n    int escena;\n    int camara;\n    int carretera;       // id de la carretera\n    float largo;         // longitud de la carretera, en metros\n    int jugador_id;      // id del vehículo del jugador\n\nPROCESS sol()\nBEGIN\n    ctype = C_3D; csubtype = C3D_LIGHT;\n    entity = g3d_light_create(G3D_LIGHT_DIRECTIONAL);\n    target_x = 0.3; target_y = -0.8; target_z = 0.5;\n    intensity = 0.6;                  // por defecto es 1.0 y los objetos blancos salen quemados\n    LOOP FRAME; END\nEND\n\nPROCESS camara_detras()\nBEGIN\n    ctype = C_3D; csubtype = C3D_CAMERA;\n    entity = camara;\n    LOOP\n        target_x = g3d_vehicle_x(jugador_id);\n        target_y = g3d_vehicle_y(jugador_id);\n        target_z = g3d_vehicle_z(jugador_id);\n        x = target_x; y = target_y + 12.0; z = target_z - 18.0;\n        FRAME;\n    END\nEND\n\n// El dibujo de un coche: sigue a su vehículo.\nPROCESS kart(int vid, int r, int g, int b)\nBEGIN\n    ctype = C_3D; csubtype = C3D_ENTITY;\n    entity = g3d_entity_spawn(escena, 0, 0.0, 0.0, 0.0);\n    g3d_entity_set_mesh(entity, g3d_primitive_cube());\n    size_x = 2.0 * 100; size_y = 1.0 * 100; size_z = 4.0 * 100;   // escala en %: dentro de un proceso la manda &#x27;size&#x27;\n    color_r = r; color_g = g; color_b = b;\n    LOOP\n        x = g3d_vehicle_x(vid); y = g3d_vehicle_y(vid) + 0.5; z = g3d_vehicle_z(vid);\n        angle_y = g3d_vehicle_yaw(vid);\n        FRAME;\n    END\nEND\n\n// Cuenta las vueltas de un vehículo. Sirve para el jugador y para los rivales.\nPROCESS vueltas(int vid, string nombre)\nPRIVATE float d; float previo; int n;\nBEGIN\n    LOOP\n        g3d_road_nearest(g3d_vehicle_x(vid), g3d_vehicle_z(vid));\n        d = g3d_road_near_dist();\n        // al cruzar la meta la distancia pasa de casi &quot;largo&quot; a casi 0\n        IF (previo &gt; largo * 0.75 AND d &lt; largo * 0.25 AND n &lt; N_VUELTAS)\n            n++;\n            say(nombre + &quot;: vuelta &quot; + itoa(n) + &quot; de &quot; + itoa(N_VUELTAS));\n            IF (n == N_VUELTAS) say(&quot;GANA &quot; + nombre); END\n        END\n        previo = d;\n        FRAME;\n    END\nEND\n\n// El jugador conduce con el teclado.\nPROCESS jugador()\nPRIVATE float acel; float giro; float freno;\nBEGIN\n    jugador_id = g3d_vehicle_create(g3d_road_x(carretera, 4.0), 1.0, g3d_road_z(carretera, 4.0),\n                                    g3d_road_yaw(carretera, 4.0));\n    g3d_vehicle_set_tuning(jugador_id, 30.0, 60.0, 32.0, 40.0, 0.8);\n    kart(jugador_id, 230, 60, 60);\n    vueltas(jugador_id, &quot;Jugador&quot;);\n    LOOP\n        acel = 0.0; giro = 0.0; freno = 0.0;\n        IF (key(_UP))    acel =  1.0; END\n        IF (key(_DOWN))  acel = -1.0; END\n        IF (key(_LEFT))  giro =  1.0; END       // dirección positiva = hacia +X = izquierda de la pantalla\n        IF (key(_RIGHT)) giro = -1.0; END\n        IF (key(_SPACE)) freno = 1.0; END\n        g3d_vehicle_update(jugador_id, DT, acel, giro, freno);\n        FRAME;\n    END\nEND\n\n// Un rival: mira un punto de la carretera 18 m por delante de él y gira hacia allí.\nPROCESS rival(float dist_inicio, int r, int g, int b)\nPRIVATE\n    int v; float d;\n    float fx; float fz;              // hacia dónde mira el coche\n    float tx; float tz; float tl;    // hacia dónde está el punto objetivo\n    float giro; float acel;\nBEGIN\n    v = g3d_vehicle_create(g3d_road_x(carretera, dist_inicio), 1.0, g3d_road_z(carretera, dist_inicio),\n                           g3d_road_yaw(carretera, dist_inicio));\n    g3d_vehicle_set_tuning(v, 26.0, 50.0, 32.0, 40.0, 0.8);\n    kart(v, r, g, b);\n    vueltas(v, &quot;Rival&quot;);\n    LOOP\n        g3d_road_nearest(g3d_vehicle_x(v), g3d_vehicle_z(v));\n        d = g3d_road_near_dist() + 18.0;\n        tx = g3d_road_x(carretera, d) - g3d_vehicle_x(v);\n        tz = g3d_road_z(carretera, d) - g3d_vehicle_z(v);\n        tl = sqrt(tx * tx + tz * tz); IF (tl &lt; 0.001) tl = 1.0; END\n        fx = sin(g3d_vehicle_yaw(v)); fz = cos(g3d_vehicle_yaw(v));\n        // producto cruzado: positivo si el objetivo queda del lado en que crece el rumbo\n        giro = (fz * tx - fx * tz) / tl * 3.0;\n        IF (giro &gt; 1.0) giro = 1.0; END\n        IF (giro &lt; -1.0) giro = -1.0; END\n        acel = 1.0 - abs(giro) * 0.5;       // frena un poco en las curvas\n        g3d_vehicle_update(v, DT, acel, giro, 0.0);\n        FRAME;\n    END\nEND\n\nPROCESS main()\nBEGIN\n    escena = g3d_scene_create(&quot;carrera&quot;);\n    g3d_scene_set_active(escena);\n    camara = g3d_camera_create();\n    g3d_camera_set_active(camara);\n\n    g3d_sky_set_gradient(0.25, 0.45, 0.85, 0.75, 0.85, 0.95);   // sin cielo la pantalla sale NEGRA\n    g3d_sky_enable(1);\n\n    // La carretera: un circuito cerrado. Nodo: x, z, y, ancho, peralte, sigue el terreno, dy, superficie.\n    // (con &#x27;sigue el terreno&#x27; a 0 la altura es la &#x27;y&#x27; del nodo; con 1 la carretera se pega al relieve + dy)\n    carretera = g3d_road_create(1);\n    g3d_road_add_node(carretera, -40.0, -30.0, 0.0, 14.0, 0.0, 0, 0.0, 0);\n    g3d_road_add_node(carretera,  50.0, -35.0, 0.0, 14.0, 0.0, 0, 0.0, 0);\n    g3d_road_add_node(carretera,  70.0,  20.0, 0.0, 14.0, 0.0, 0, 0.0, 0);\n    g3d_road_add_node(carretera,  10.0,  60.0, 8.0, 14.0, 0.0, 0, 0.0, 1);   // sube 8 m, y su tramo es de tierra\n    g3d_road_add_node(carretera, -50.0,  30.0, 0.0, 14.0, 0.0, 0, 0.0, 0);\n    g3d_road_build(carretera);\n    g3d_road_show(carretera, escena);        // SOLO para este ejemplo: en tu juego la carretera ya está pintada en tu mapa\n    g3d_road_set_ground(carretera, 1);       // y aquí tiene que ser suelo (normalmente lo es tu terreno o tu modelo)\n    largo = g3d_road_length(carretera);\n\n    sol();\n    jugador();\n    rival(20.0, 60, 90, 240);\n    camara_detras();\n\n    LOOP\n        IF (key(_ESC)) exit(); END\n        FRAME;\n    END\nEND<\/code><\/pre><\/div>\n<h2 id=\"una-carretera-marcada-en-el-editor\">Una carretera marcada en el editor<\/h2>\n<p>En el editor no se dibuja la carretera: <strong>la pintas tú<\/strong> en el terreno con las herramientas de terreno (la textura que quieras) o pones un modelo <code>.glb<\/code> de pista como un objeto más de la escena. Después, en el modo <strong>Terreno<\/strong>, eliges la herramienta <strong>Carretera<\/strong> y haces clic a lo largo de ella para decir *por dónde se puede circular*.<\/p>\n<ul><li>Puedes hacer clic sobre el terreno o sobre el modelo; se toma lo que ves más cerca. Sobre un modelo, el punto<\/li><\/ul>\n<p>  se queda a la altura de su superficie.<\/p>\n<ul><li>Ajustas el <strong>ancho<\/strong> y el <strong>peralte<\/strong> de cada punto y la <strong>superficie<\/strong> de cada tramo.<\/li><li>En el visor se ve una guía (la línea central y los bordes del ancho). <strong>No existe en el juego.<\/strong><\/li><li>La carretera <strong>se guarda dentro de la escena<\/strong> (junto al terreno y los objetos), así que viaja con ella.<\/li><\/ul>\n<p>Al generar el juego, esa carretera ya está creada y calculada cuando empieza tu código. Su id es 0 (la siguiente, 1...), así que basta con usarla:<\/p>\n<div class=\"bloque\"><button class=\"copiar\" type=\"button\">Copiar<\/button><pre><code class=\"lang-bennugd\">carretera = 0;                         // la primera carretera de la escena\nlargo = g3d_road_length(carretera);\njugador_id = g3d_vehicle_create(g3d_road_x(carretera, 4.0), 1.0, g3d_road_z(carretera, 4.0),\n                                g3d_road_yaw(carretera, 4.0));<\/code><\/pre><\/div>\n<p>Todo lo demás (dónde salen los coches, la meta, las vueltas, los rivales) es código tuyo, como en el ejemplo.<\/p>\n<h2 id=\"c-mo-funciona\">Cómo funciona<\/h2>\n<ul><li><strong>Dónde salen los coches:<\/strong> en <code>g3d_road_x/z/yaw(carretera, 4.0)<\/code>, a 4 m del principio y mirando como la carretera.<\/li><li><strong>Vueltas:<\/strong> <code>vueltas()<\/code> mira a cada vehículo con <code>g3d_road_nearest<\/code> y detecta cuando su distancia recorrida<\/li><\/ul>\n<p>  salta de casi <code>largo<\/code> a casi 0. Un solo proceso sirve para cualquier número de coches.<\/p>\n<ul><li><strong>Rival:<\/strong> cada frame busca su sitio en la carretera, mira el punto 18 m más adelante y gira hacia él.<\/li><\/ul>\n<p>  Con <code>g3d_road_near_offset()<\/code> (separación lateral, positiva a la izquierda) puedes hacerle seguir una línea   distinta del centro.<\/p>\n<ul><li><strong>Superficie:<\/strong> <code>g3d_road_near_surface()<\/code> te dice si el coche pisa asfalto, tierra, hielo o barro (las<\/li><\/ul>\n<p>  etiquetas las pones al dibujar). Qué le pasa al coche en cada una lo decides tú, por ejemplo con   <code>g3d_vehicle_set_tuning<\/code>.<\/p>\n<ul><li><strong>Fuera de la carretera:<\/strong> <code>g3d_road_near_on()<\/code> vale 0 si el coche se sale del ancho.<\/li><\/ul>\n<h2 id=\"c-mo-crecer-desde-aqu\">Cómo crecer desde aquí<\/h2>\n<div class=\"tabla\"><table><thead><tr><th>Quieres...<\/th><th>Usa<\/th><\/tr><\/thead><tbody><tr><td>Posición en carrera (1º, 2º...)<\/td><td>compara la vuelta y <code>g3d_road_near_dist()<\/code> de cada coche<\/td><\/tr><tr><td>Volver a la pista tras salirse<\/td><td><code>g3d_road_nearest<\/code> y colocar el coche en <code>g3d_road_x/z(carretera, g3d_road_near_dist())<\/code><\/td><\/tr><tr><td>Un circuito dibujado en el editor<\/td><td>herramienta Carretera del modo Terreno (ver arriba)<\/td><\/tr><tr><td>Turbos, rampas, obstáculos<\/td><td>procesos con una distancia a lo largo de la carretera: <code>d<\/code> y <code>g3d_road_near_offset()<\/code><\/td><\/tr><tr><td>Velocímetro<\/td><td><code>g3d_vehicle_speed(id)<\/code><\/td><\/tr><tr><td>Cámara con colisión<\/td><td><code>g3d_camera_safe_distance<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><strong>Suelo y aspecto:<\/strong> la carretera es solo información: ni se dibuja ni cambia el suelo. El suelo es el de tu terreno o tu modelo, y lo que ves es lo que pintaste. Para una carretera inventada por código, <code>g3d_road_show<\/code> la dibuja y <code>g3d_road_set_ground<\/code> la hace suelo (como en este ejemplo); los cuerpos rígidos de Jolt no la notan.<\/blockquote>"}],"api":[{"n":"g3d_sprite_create","m":"3d","c":"sprite","p":["int","float","float","float"],"pn":["escena","x","y","z"],"r":"int","d":"Crea un sprite 2D dentro del mundo 3D (estilo HD-2D). Es un quad que se dibuja en el pase opaco con recorte alfa, asi que tapa y es tapado por la geometria 3D sin ordenar nada. La textura sale de un grafico normal de BennuGD2, por lo que se anima como en 2D, cambiando el grafico.","rd":"id del sprite","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_destroy","m":"3d","c":"sprite","p":["int"],"pn":["sprite"],"r":"int","d":"Destruye un sprite.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_height","m":"3d","c":"sprite","p":["int","float"],"pn":["sprite","alto"],"r":"int","d":"Fija el alto del sprite en unidades de mundo.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_pixels_per_unit","m":"3d","c":"sprite","p":["int","float"],"pn":["sprite","pixeles_por_unidad"],"r":"int","d":"Cuantos pixeles del grafico entran en una unidad de mundo. Es lo comodo para pixel art: el tamano sale del propio grafico.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_anchor","m":"3d","c":"sprite","p":["int","float","float"],"pn":["sprite","ax","ay"],"r":"int","d":"Punto del grafico que se coloca en (x, y, z), de 0 a 1. (0.5, 1.0) = centro-abajo: los pies del personaje sobre el suelo.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_billboard","m":"3d","c":"sprite","p":["int","int"],"pn":["sprite","modo"],"r":"int","d":"Como se encara a la camara: G3D_SPRITE_UPRIGHT (0) gira solo en horizontal y sigue de pie (personajes); G3D_SPRITE_FACING (1) mira siempre de frente (objetos, efectos).","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_cutout","m":"3d","c":"sprite","p":["int","float"],"pn":["sprite","umbral"],"r":"int","d":"Umbral de alfa: los pixeles con alfa por debajo se descartan y dejan un agujero.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_shadow","m":"3d","c":"sprite","p":["int","int"],"pn":["sprite","activar"],"r":"int","d":"Activa (1) o desactiva (0) que el sprite proyecte sombra: el mismo quad con el mismo recorte alfa entra en el mapa de sombras.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_dir","m":"3d","c":"sprite","p":["int","float","int"],"pn":["sprite","angulo","ndirs"],"r":"int","d":"Que postura dibujar segun desde donde se mira: 0 = de frente a la camara, y va girando hasta ndirs-1. Con esto el .prg elige el grafico de entre sus N posturas. El angulo va en MILESIMAS DE GRADO, como el local 'angle'.","rd":"indice de la postura (0 .. ndirs-1)","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_smooth","m":"3d","c":"sprite","p":["int","int"],"pn":["sprite","activar"],"r":"int","d":"Filtrado de la textura. Por defecto es nearest (pixel art); con 1 es bilineal suavizado.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_lit","m":"3d","c":"sprite","p":["int","int"],"pn":["sprite","activar"],"r":"int","d":"Con 1 (por defecto) le afecta la luz de la escena, de modo que se apaga de noche y con el ciclo de dia en vez de ir siempre a pleno brillo.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_snap","m":"3d","c":"sprite","p":["int","int"],"pn":["sprite","activar"],"r":"int","d":"Con 1 (por defecto) la posicion en pantalla se redondea a pixeles enteros, para que el pixel art no tiemble al moverse.","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_sprite_set_cell","m":"3d","c":"sprite","p":["int","int","int","int","int"],"pn":["sprite","x","y","ancho","alto"],"r":"int","d":"Recorte en pixeles dentro del grafico, para hojas de sprites irregulares (el editor saca estas medidas al detectar los fotogramas).","rd":"","e":"","g":"07-sprites","ov":[]},{"n":"g3d_scene_create","m":"3d","c":"scene","p":["string"],"pn":["nombre"],"r":"int","d":"Crea una escena vacia.","rd":"id de la escena","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_scene_destroy","m":"3d","c":"scene","p":["int"],"pn":["escena"],"r":"int","d":"Destruye una escena.","rd":"","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_scene_set_active","m":"3d","c":"scene","p":["int"],"pn":["escena"],"r":"int","d":"Hace activa una escena: es la que se renderiza.","rd":"","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_entity_spawn","m":"3d","c":"entity","p":["int","int","float","float","float"],"pn":["escena","modelo","x","y","z"],"r":"int","d":"Crea una entidad con un modelo en una escena.","rd":"id de la entidad","e":"","g":"02-procesos-3d","ov":[]},{"n":"g3d_entity_destroy","m":"3d","c":"entity","p":["int"],"pn":["entidad"],"r":"int","d":"Destruye una entidad.","rd":"","e":"","g":"02-procesos-3d","ov":[]},{"n":"g3d_model_despawn","m":"3d","c":"model","p":["int"],"pn":["raiz"],"r":"int","d":"Destruye una entidad raiz creada con G3D_MODEL_SPAWN, todas sus mallas hijas y sus materiales privados. Usala al crear y quitar modelos constantemente para no agotar los huecos de entidades y materiales. Tambien vale para una sola entidad con material (p. ej. un trozo de fractura).","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_entity_set_position","m":"3d","c":"entity","p":["int","float","float","float"],"pn":["entidad","x","y","z"],"r":"int","d":"Posicion de la entidad en el mundo. OJO: si la entidad pertenece a un proceso C_3D, el proceso la pisa en cada frame con sus variables (x, y, z); usala solo en entidades sin proceso.","rd":"","e":"","g":"02-procesos-3d","ov":[]},{"n":"g3d_entity_set_rotation","m":"3d","c":"entity","p":["int","float","float","float"],"pn":["entidad","pitch","yaw","roll"],"r":"int","d":"Rotacion de la entidad. Los angulos van en MILESIMAS DE GRADO, como los de BennuGD (90000 = 90 grados). OJO: si la entidad pertenece a un proceso C_3D, el proceso la pisa en cada frame con sus variables (angle_x/y/z); usala solo en entidades sin proceso.","rd":"","e":"g3d_entity_set_rotation(e, 0, 90000, 0);   // girada 90 grados sobre Y","g":"02-procesos-3d","ov":[]},{"n":"g3d_entity_set_scale","m":"3d","c":"entity","p":["int","float","float","float"],"pn":["entidad","sx","sy","sz"],"r":"int","d":"Escala de la entidad en cada eje (1.0 = tamano original). OJO: si la entidad pertenece a un proceso C_3D, el proceso la pisa en cada frame con sus variables (size, size_x/y/z); usala solo en entidades sin proceso.","rd":"","e":"","g":"02-procesos-3d","ov":[]},{"n":"g3d_entity_get_position","m":"3d","c":"entity","p":["int","pointer","pointer","pointer"],"pn":["entidad","&x","&y","&z"],"r":"int","d":"Lee la posicion de la entidad en tres variables float que se pasan por puntero.","rd":"","e":"","g":"02-procesos-3d","ov":[]},{"n":"g3d_entity_get_rotation","m":"3d","c":"entity","p":["int","pointer","pointer","pointer"],"pn":["entidad","&pitch","&yaw","&roll"],"r":"int","d":"Lee la rotacion de la entidad en tres variables que se pasan por puntero.","rd":"","e":"","g":"02-procesos-3d","ov":[]},{"n":"g3d_entity_set_parent","m":"3d","c":"entity","p":["int","int"],"pn":["entidad","padre"],"r":"int","d":"Hace que una entidad cuelgue de otra (hereda su transformacion).","rd":"","e":"","g":"02-procesos-3d","ov":[]},{"n":"g3d_camera_create","m":"3d","c":"camera","p":[],"pn":[],"r":"int","d":"Crea una camara.","rd":"id de la camara","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_camera_set_active","m":"3d","c":"camera","p":["int"],"pn":["camara"],"r":"int","d":"Hace activa una camara: es la que se usa para renderizar.","rd":"","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_camera_set_position","m":"3d","c":"camera","p":["int","float","float","float"],"pn":["camara","x","y","z"],"r":"int","d":"Coloca la camara en el mundo.","rd":"","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_camera_look_at","m":"3d","c":"camera","p":["int","float","float","float","float","float","float"],"pn":["camara","objetivo_x","objetivo_y","objetivo_z","arriba_x","arriba_y","arriba_z"],"r":"int","d":"Orienta la camara hacia un punto. (ux,uy,uz) es el vector que apunta hacia arriba, normalmente (0,1,0).","rd":"","e":"g3d_camera_set_position(cam, 0, 5, -10);\ng3d_camera_look_at(cam, 0, 1, 0, 0, 1, 0);","g":"01-primeros-pasos","ov":[]},{"n":"g3d_camera_set_projection","m":"3d","c":"camera","p":["int","int"],"pn":["camara","tipo"],"r":"int","d":"OBSOLETA: no hace nada. Usa G3D_CAMERA_SET_FOV.","rd":"","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_camera_set_fov","m":"3d","c":"camera","p":["int","float"],"pn":["camara","fov_grados"],"r":"int","d":"Campo de vision vertical de la camara, en GRADOS (por defecto 75). Fija aspecto 16:9, near 0.1 y far 1000.","rd":"","e":"","g":"01-primeros-pasos","ov":[]},{"n":"g3d_load_gltf","m":"3d","c":"load","p":["string"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_load_tr","m":"3d","c":"load","p":["string"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_tr_probe","m":"3d","c":"tr","p":["string"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_gltf_set_recenter","m":"3d","c":"gltf","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_fbx_set_recenter","m":"3d","c":"fbx","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_gltf_set_chunking","m":"3d","c":"gltf","p":["float"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"","ov":[]},{"n":"g3d_load_gltf_fractured","m":"3d","c":"load","p":["string"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_load_obj","m":"3d","c":"load","p":["string"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_load_fbx","m":"3d","c":"load","p":["string"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_mesh","m":"3d","c":"model","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_texture","m":"3d","c":"model","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_submesh_count","m":"3d","c":"model","p":["int"],"pn":[],"r":"int","d":"","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_height","m":"3d","c":"model","p":["int"],"pn":["modelo"],"r":"float","d":"Altura total del modelo: la extension maxima en Y entre todas sus mallas.","rd":"altura","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_size","m":"3d","c":"model","p":["int"],"pn":["modelo"],"r":"float","d":"Mayor dimension del modelo (ancho, alto o fondo) entre todas sus mallas. Util para encuadrar un modelo con una camara libre sea cual sea su escala.","rd":"extension maxima","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_orient","m":"3d","c":"model","p":["int","float","float","float"],"pn":["modelo","rx","ry","rz"],"r":"int","d":"Corrige la orientacion del modelo: aplica una rotacion a sus vertices y vuelve a apoyarlo en el suelo. Sirve para modelos cuya pose original viene inclinada. OJO: los angulos van en RADIANES (a diferencia de las rotaciones de entidad, que van en milesimas de grado).","rd":"","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_anim_count","m":"3d","c":"model","p":["int"],"pn":["modelo"],"r":"int","d":"Numero de animaciones que trae el modelo.","rd":"cantidad","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_anim_duration","m":"3d","c":"model","p":["int","int"],"pn":["modelo","animacion"],"r":"float","d":"Duracion de una animacion.","rd":"duracion, en la misma unidad de tiempo que usa G3D_MODEL_ANIMATE","e":"","g":"06-modelos","ov":[]},{"n":"g3d_model_animate","m":"3d","c":"model","p":["int","int","float","int"],"pn":["modelo","animacion","tiempo","bucle"],"r":"int","d":"Pone al modelo (con esque
